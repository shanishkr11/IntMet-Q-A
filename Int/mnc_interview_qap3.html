"Q876", "meta": "Deloitte – Scenario", "title": "One service is healthy but the system is slow — why?", "body": "Because:\n●\tDownstream dependency slow\n●\tThread exhaustion\n●\tRetry storms\n"}]}, {"title": "🧠 DEPLOYMENT & RELEASE", "questions": [{"id": "Q877", "meta": "Accenture – DevOps Round", "title": "What are feature flags and why use them?", "body": "Deploy feature but disable it until safe. Helps in safe rollout.\n"}]}, {"title": "🧠 DATA MIGRATION", "questions": [{"id": "Q878", "meta": "Microsoft – Architecture", "title": "How do you migrate monoliths to microservices safely?", "body": "●\tStrangler pattern\n●\tIncremental extraction\n●\tParallel run\n"}]}, {"title": "🧠 STRANGLER PATTERN", "questions": [{"id": "Q879", "meta": "Amazon – Interview Favorite", "title": "Explain Strangler Fig pattern", "body": "Gradually replace old system pieces with new microservices. Zero big-bang migration.\n"}]}, {"title": "🧠 CROSS-CUTTING CONCERNS", "questions": [{"id": "Q880", "meta": "Accenture – Technical Round", "title": "How do you handle logging, auth, rate limiting centrally?", "body": "API Gateway + Service Mesh\n"}]}, {"title": "🧠 TEAM & ORG DESIGN", "questions": [{"id": "Q881", "meta": "Microsoft – Senior Round", "title": "Conway’s Law — what is it?", "body": "System design reflects team structure. Design teams thoughtfully.\n"}]}, {"title": "🧠 PERFORMANCE OPTIMIZATION", "questions": [{"id": "Q882", "meta": "Amazon – Advanced", "title": "How to reduce latency?", "body": "●\tCo-locate services\n●\tAsync where possible\n●\tReduce chattiness\n"}]}, {"title": "🧠 BACKPRESSURE", "questions": [{"id": "Q883", "meta": "Microsoft – Advanced", "title": "What is backpressure?", "body": "Prevents fast producers from overwhelming slow consumers.\n"}]}, {"title": "🧠 COST & GOVERNANCE", "questions": [{"id": "Q884", "meta": "Accenture – Architecture Round", "title": "How to control cloud cost?", "body": "●\tAuto-scale wisely\n●\tRight-size resources\n●\tResource limits\n"}]}, {"title": "🧠 SECURITY INCIDENTS", "questions": [{"id": "Q885", "meta": "Deloitte – Scenario", "title": "Compromised service — actions?", "body": "Revoke tokens Isolate service Rotate secrets\n"}]}, {"title": "🧠 ANTI-PATTERNS", "questions": [{"id": "Q886", "meta": "Microsoft – Interview Favorite", "title": "Common microservices anti-patterns", "body": "●\tShared database\n●\tOver-microservicing\n●\tChatty services\n"}]}, {"title": "🧠 DESIGN VALIDATION", "questions": [{"id": "Q887", "meta": "Amazon – Senior Round", "title": "How to test microservices architecture?", "body": "Unit tests Contract tests Chaos testing\n"}]}, {"title": "🧠 CHAOS ENGINEERING", "questions": [{"id": "Q888", "meta": "Microsoft – Advanced", "title": "What is Chaos Engineering?", "body": "Intentionally breaking components to ensure resilience.\n"}]}, {"title": "🧠 REAL INTERVIEW BEHAVIOR", "questions": [{"id": "Q889", "meta": "ALL MNCs", "title": "How do you explain complex architecture to non-tech people?", "body": "Use: Diagrams\nSimple analogies Business outcomes\n"}]}, {"title": "🏁 FINAL MICROSOFTERVICES QUESTION", "questions": [{"id": "Q890", "meta": "ALL MNCs – FINAL", "title": "What decides success in microservices?", "body": "Best Answer\n“Clear boundaries, disciplined DevOps, strong observability, resilience, and teams that understand responsibility and ownership.”\n"}]}]}];

function chKey(title) {
  const m = title.match(/^CHAPTER (\d+)/);
  return m ? `CHAPTER ${m[1]}` : 'CHAPTER 8';
}

function chCfg(title) {
  return CH_CONFIG[chKey(title)] || CH_CONFIG['CHAPTER 8'];
}

/* ── Company pills ── */
function parseMeta(meta) {
  if (!meta) return { company:'', round:'' };
  const dash = meta.indexOf('–');
  if (dash === -1) return { company: meta.trim(), round: '' };
  return { company: meta.slice(0, dash).trim(), round: meta.slice(dash+1).trim() };
}

function companyClass(company) {
  const c = company.toLowerCase();
  if (c.includes('microsoft')) return 'pill-microsoft';
  if (c.includes('amazon'))    return 'pill-amazon';
  if (c.includes('accenture')) return 'pill-accenture';
  if (c.includes('infosys'))   return 'pill-infosys';
  if (c.includes('tcs'))       return 'pill-tcs';
  if (c.includes('deloitte'))  return 'pill-deloitte';
  if (c.includes('all mnc') || c.includes('all mncs')) return 'pill-all';
  return 'pill-default';
}

function pillsHTML(meta) {
  if (!meta) return '';
  const { company, round } = parseMeta(meta);
  const cls = companyClass(company);
  return `<span class="pill ${cls}">${company}</span>${round ? `<span class="pill pill-round">${round}</span>` : ''}`;
}

/* ── Body formatter ── */
function isCodeish(line) {
  const t = line.trim();
  return /^(public|private|protected|async |static |var |const |let |using |return |if |app\.|builder\.|services\.|new |import |from |await |function |class |interface )/.test(t)
    || /^\[/.test(t) || /^\{/.test(t) || /^\}/.test(t)
    || t.endsWith('{') || t.endsWith('}') || t.endsWith(';')
    || /^<[A-Za-z]/.test(t);
}

const LABEL_RE = /^(Explanation|Real-time C# example|Real-time example|Real project usage|Real project|Real-time production|Real Flow|Interview Tip|Interview tip|Real-World|Real-world|Real World|Solutions|Options|Best Interview Answer|Benefit|Why\?|Correct Approach|Production|Real Interview Tip|Professional Approach|Real Project Usage|Benefits|Example|Real Scenario|Easy Explanation|Easy, Ready-to-Speak Answer|Confident Answer|Best Answer|Quick Answer|How to Answer)/i;

const QUOTE_RE = /^[""].+[""]\.?$/;

function formatBody(raw, chColor) {
  if (!raw) return '';
  const lines = raw.split('\n');
  let out = '';
  let code = [];

  const flushCode = () => {
    if (!code.length) return;
    const esc = code.join('\n').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    out += `<pre>${esc}</pre>`;
    code = [];
  };

  for (const rawLine of lines) {
    const t = rawLine.trim();
    if (!t) continue;

    if (LABEL_RE.test(t)) {
      flushCode();
      out += `<div class="lbl">${t}</div>`;
      continue;
    }

    if (QUOTE_RE.test(t) && t.length > 30) {
      flushCode();
      out += `<div class="tip">${t}</div>`;
      continue;
    }

    if (/^Best (Interview )?Answer/.test(t) || /^Confident Answer/.test(t)) {
      flushCode();
      out += `<div class="lbl">${t}</div>`;
      continue;
    }

    if (t.startsWith('●') || t.startsWith('✔') || t.startsWith('❌') || t.startsWith('→') || /^\d[\.\)]\s/.test(t) || /^\d\s[A-Z]/.test(t)) {
      flushCode();
      const text = t.replace(/^[●✔❌→\d\.\)\s]+/,'').trim();
      out += `<div class="bul"><div class="bul-dot"></div><span>${text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span></div>`;
      continue;
    }

    if (isCodeish(rawLine) || code.length > 0 && /^\s{2,}/.test(rawLine)) {
      code.push(rawLine);
      continue;
    }

    flushCode();
    out += `<p style="margin:4px 0">${t.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>`;
  }
  flushCode();
  return out;
}

/* ── Card renderer ── */
function renderCard(q, ci, delay=0) {
  const ch = DATA[ci];
  const cfg = chCfg(ch.title);
  const numStyle = `background:${cfg.dim};color:${cfg.color}`;
  const style = `animation-delay:${delay}ms; --active-card-color:${cfg.color}; --active-card-dim:${cfg.dim};`;
  return `
  <div class="q-card" id="qc-${q.id}" style="${style}">
    <div class="q-header" onclick="toggleCard('${q.id}')">
      <div class="q-num-wrap">
        <span class="q-num" style="${numStyle}">${q.id}</span>
      </div>
      <div class="q-center">
        <div class="q-title">${q.title || 'Question'}</div>
        <div class="q-pills">${pillsHTML(q.meta)}</div>
      </div>
      <div class="expand-icon">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>
    <div class="q-body">
      <div class="q-body-inner">${formatBody(q.body, cfg.color)}</div>
    </div>
  </div>`;
}

function toggleCard(id) {
  document.getElementById(`qc-${id}`).classList.toggle('open');
}

/* ── Sidebar ── */
function buildSidebar() {
  const aside = document.getElementById('sidebar');
  const dotsEl = document.getElementById('chDots');

  dotsEl.innerHTML = DATA.map((ch, ci) => {
    const cfg = chCfg(ch.title);
    return `<div class="ch-dot" style="background:${cfg.color}" title="${ch.title}" onclick="jumpChapter(${ci})"></div>`;
  }).join('');

  aside.innerHTML = DATA.map((ch, ci) => {
    const cfg = chCfg(ch.title);
    const nonEmpty = ch.sections.filter(s => s.questions.length > 0);
    const slug = `chg-${ci}`;
    const items = nonEmpty.map((sec, si) => {
      const label = sec.title.replace(/^[^\w\s]+\s*/,'').replace(/\s*\(Q\d+[–\-]Q?\d+\)/i,'').trim();
      return `<div class="section-item" data-ci="${ci}" data-si="${si}" onclick="showSection(${ci},${si})" style="--active-color:${cfg.color};--active-bg:${cfg.bg}">${label}<span class="sec-count">${sec.questions.length}</span></div>`;
    }).join('');

    return `
    <div class="chapter-group" id="${slug}">
      <div class="chapter-label" onclick="toggleCh('${slug}')">
        <span class="ch-badge" style="background:${cfg.dim};color:${cfg.color}">CH${cfg.num}</span>
        ${ch.title.replace(/^CHAPTER \d+ [–\-]\s*/,'')}
        <svg class="ch-arrow" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="section-list">${items}</div>
    </div>`;
  }).join('');
}

function toggleCh(id) {
  document.getElementById(id).classList.toggle('collapsed');
}

function jumpChapter(ci) {
  // expand and show first section
  const group = document.getElementById(`chg-${ci}`);
  group.classList.remove('collapsed');
  const nonEmpty = DATA[ci].sections.filter(s => s.questions.length > 0);
  if (nonEmpty.length) showSection(ci, 0);
}

/* ── Show section ── */
let curState = null;

function showSection(ci, si) {
  const ch = DATA[ci];
  const cfg = chCfg(ch.title);
  const nonEmpty = ch.sections.filter(s => s.questions.length > 0);
  const sec = nonEmpty[si];
  if (!sec) return;

  curState = { ci, si };
  document.getElementById('searchInput').value = '';
  document.getElementById('statBadge').textContent = `${sec.questions.length} Q`;

  // sidebar active
  document.querySelectorAll('.section-item').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.section-item[data-ci="${ci}"][data-si="${si}"]`);
  if (el) { el.classList.add('active'); el.scrollIntoView({ block:'nearest' }); }

  const main = document.getElementById('main');
  const secLabel = sec.title.replace(/^[^\w\s]+\s*/,'').replace(/\s*\(Q\d+[–\-]Q?\d+\)/i,'').trim();
  const chName = ch.title.replace(/^CHAPTER \d+ [–\-]\s*/,'');
  const ids = sec.questions.map(q => q.id);
  const range = ids.length ? `${ids[0]} – ${ids[ids.length-1]}` : '';

  main.innerHTML = `
    <div class="sec-hero">
      <div class="sec-hero-left">
        <div class="sec-crumb">
          <div class="sec-crumb-dot" style="background:${cfg.color}"></div>
          Chapter ${cfg.num} &middot; ${chName}
        </div>
        <div class="sec-title">${secLabel}</div>
      </div>
      <div class="sec-meta-right">
        ${range ? `<div class="q-range-badge">${range}</div>` : ''}
        <div style="font-size:.75rem;color:var(--text-muted)">${sec.questions.length} question${sec.questions.length!==1?'s':''}</div>
      </div>
    </div>
    <div class="q-grid">${sec.questions.map((q,i) => renderCard(q, ci, i * 25)).join('')}</div>`;
}

/* ── Search ── */
function handleSearch(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    if (curState) showSection(curState.ci, curState.si);
    else showWelcome();
    document.getElementById('statBadge').textContent = '234 Questions';
    return;
  }

  const hits = [];
  DATA.forEach((ch, ci) => {
    ch.sections.filter(s => s.questions.length > 0).forEach((sec, si) => {
      sec.questions.forEach(quest => {
        if (
          quest.title.toLowerCase().includes(q) ||
          quest.body.toLowerCase().includes(q) ||
          quest.meta.toLowerCase().includes(q) ||
          quest.id.toLowerCase().includes(q)
        ) hits.push({ ci, ch, quest });
      });
    });
  });

  document.querySelectorAll('.section-item').forEach(el => el.classList.remove('active'));
  document.getElementById('statBadge').textContent = `${hits.length} found`;

  const main = document.getElementById('main');
  if (!hits.length) {
    main.innerHTML = `<div class="empty"><div class="empty-icon">⌕</div><h3>No results for "${query}"</h3><p>Try a different keyword, question number, or company name</p></div>`;
    return;
  }

  let prevCh = '';
  const cards = hits.map((h, i) => {
    let divider = '';
    if (h.ch.title !== prevCh) {
      prevCh = h.ch.title;
      const cfg = chCfg(h.ch.title);
      const name = h.ch.title.replace(/^CHAPTER \d+ [–\-]\s*/,'');
      if (i > 0) divider = `<div class="ch-divider"><div class="ch-divider-line"></div><span style="color:${cfg.color}">${name}</span><div class="ch-divider-line"></div></div>`;
      else divider = `<div style="margin-bottom:16px;font-family:'Fraunces',serif;font-size:1.3rem;font-weight:300;color:${cfg.color}">${name}</div>`;
    }
    return divider + renderCard(h.quest, h.ci, i * 20);
  }).join('');

  main.innerHTML = `
    <div class="result-bar"><span class="r-count">${hits.length}</span> result${hits.length!==1?'s':''} for <strong>"${query}"</strong></div>
    <div class="q-grid">${cards}</div>`;
}

/* ── Welcome ── */
function showWelcome() {
  const total = DATA.reduce((s, ch) => s + ch.sections.reduce((ss, sec) => ss + sec.questions.length, 0), 0);

  const cards = DATA.map((ch, ci) => {
    const cfg = chCfg(ch.title);
    const n = ch.sections.reduce((s, sec) => s + sec.questions.length, 0);
    const name = ch.title.replace(/^CHAPTER \d+ [–\-]\s*/,'');
    return `<div class="chapter-card" style="--card-accent:${cfg.color}" onclick="jumpChapter(${ci})">
      <div class="card-ch-num" style="color:${cfg.color}">Chapter ${cfg.num}</div>
      <div class="card-ch-name">${name}</div>
      <div class="card-ch-count" style="color:${cfg.color}">${n}</div>
      <div class="card-ch-label">questions</div>
    </div>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="welcome">
      <div class="welcome-eyebrow">MNC Interview Preparation · Advanced Topics</div>
      <div class="welcome-title">Full-Stack .NET<br><em>Interview Q&amp;A</em></div>
      <div class="welcome-desc">
        ${total} curated questions covering DevOps, Cloud/Azure, HR scenarios, System Design, and Microservices — sourced from real interview rounds at Microsoft, Amazon, Accenture, Infosys, TCS, and Deloitte.
      </div>
      <div class="chapter-cards">${cards}</div>
      <div class="welcome-hint">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        Select a section from the sidebar, click a chapter card above, or use the search bar
      </div>
    </div>`;
}

/* ── Init ── */
buildSidebar();
showWelcome();

/* keyboard shortcut */
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  if (e.key === 'Escape') {
    document.getElementById('searchInput').blur();
  }
});
</script>
</body>
</html>
