<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MNC Interview Q&A – Chapters 8–12</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0e13;
    --sidebar-bg: #0e1118;
    --sidebar-border: #1a1f2b;
    --card-bg: #13181f;
    --card-border: #1c2333;
    --card-hover: #1a2030;
    --accent: #38bdf8;
    --accent-dim: #0c2d45;
    --accent-glow: rgba(56,189,248,0.08);
    --text-primary: #e2e8f0;
    --text-secondary: #718096;
    --text-muted: #3d4a5c;
    --green: #4ade80;
    --amber: #fbbf24;
    --rose: #fb7185;
    --purple: #c084fc;
    --coral: #f97316;
    --teal: #2dd4bf;
    --code-bg: #08090d;
    --header-h: 58px;
    --sidebar-w: 288px;

    /* chapter accent colours */
    --ch8: #f97316;
    --ch9: #38bdf8;
    --ch10: #c084fc;
    --ch11: #4ade80;
    --ch12: #fb7185;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: grid;
    grid-template-rows: var(--header-h) 1fr;
    grid-template-columns: var(--sidebar-w) 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ────── HEADER ────── */
  header {
    grid-column: 1 / -1;
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--sidebar-border);
    display: flex;
    align-items: center;
    padding: 0 28px;
    gap: 18px;
    position: relative;
    z-index: 100;
  }
  .logo {
    display: flex;
    align-items: baseline;
    gap: 10px;
    white-space: nowrap;
  }
  .logo-main {
    font-family: 'Fraunces', serif;
    font-size: 1.2rem;
    color: var(--text-primary);
    font-weight: 600;
  }
  .logo-tag {
    font-size: 0.72rem;
    color: var(--text-muted);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }
  .search-wrap {
    flex: 1;
    max-width: 520px;
    position: relative;
    margin-left: 8px;
  }
  .search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 9px;
    padding: 9px 14px 9px 40px;
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.875rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #searchInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56,189,248,0.08);
  }
  #searchInput::placeholder { color: var(--text-muted); }
  .kbd {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.65rem;
    color: var(--text-muted);
    background: var(--sidebar-bg);
    border: 1px solid var(--sidebar-border);
    padding: 1px 5px;
    border-radius: 4px;
    pointer-events: none;
  }
  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .stat-badge {
    background: var(--accent-dim);
    color: var(--accent);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .ch-dots {
    display: flex;
    gap: 5px;
  }
  .ch-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .ch-dot:hover { transform: scale(1.4); }

  /* ────── SIDEBAR ────── */
  aside {
    background: var(--sidebar-bg);
    border-right: 1px solid var(--sidebar-border);
    overflow-y: auto;
    padding: 12px 0 48px;
    scrollbar-width: thin;
    scrollbar-color: var(--card-border) transparent;
  }
  aside::-webkit-scrollbar { width: 3px; }
  aside::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 2px; }

  .sidebar-search-clear {
    display: none;
    font-size: 0.72rem;
    color: var(--text-muted);
    text-align: center;
    padding: 6px 16px 10px;
    cursor: pointer;
  }
  .sidebar-search-clear:hover { color: var(--accent); }

  .chapter-group { margin-bottom: 2px; }

  .chapter-label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 18px 7px;
    font-size: 0.67rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    position: sticky;
    top: 0;
    background: var(--sidebar-bg);
    z-index: 3;
    border-bottom: 1px solid transparent;
    transition: color 0.2s;
  }
  .chapter-label:hover { color: var(--text-secondary); }
  .chapter-label.stuck { border-bottom-color: var(--sidebar-border); }

  .ch-badge {
    padding: 2px 7px;
    border-radius: 5px;
    font-size: 0.62rem;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  .ch-arrow {
    margin-left: auto;
    transition: transform 0.22s;
    color: var(--text-muted);
  }
  .chapter-group.collapsed .ch-arrow { transform: rotate(-90deg); }
  .chapter-group.collapsed .section-list { display: none; }

  .section-item {
    display: flex;
    align-items: center;
    padding: 6px 18px 6px 26px;
    font-size: 0.8rem;
    color: var(--text-secondary);
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.13s;
    line-height: 1.4;
    gap: 6px;
  }
  .section-item:hover { color: var(--text-primary); background: rgba(255,255,255,0.025); }
  .section-item.active {
    font-weight: 600;
    border-left-color: var(--active-color, var(--accent));
    background: var(--active-bg, var(--accent-glow));
    color: var(--active-color, var(--accent));
  }
  .sec-count {
    margin-left: auto;
    font-size: 0.68rem;
    color: var(--text-muted);
    background: rgba(255,255,255,0.04);
    padding: 1px 7px;
    border-radius: 10px;
    flex-shrink: 0;
    font-weight: 500;
  }
  .section-item.active .sec-count {
    background: rgba(255,255,255,0.08);
    color: inherit;
  }

  /* ────── MAIN ────── */
  main {
    overflow-y: auto;
    padding: 36px 44px 60px;
    scrollbar-width: thin;
    scrollbar-color: var(--card-border) transparent;
  }
  main::-webkit-scrollbar { width: 5px; }
  main::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 3px; }

  /* ── Section header ── */
  .sec-hero {
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--card-border);
    display: flex;
    align-items: flex-end;
    gap: 16px;
  }
  .sec-hero-left { flex: 1; }
  .sec-crumb {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sec-crumb-dot {
    width: 6px; height: 6px; border-radius: 50%;
  }
  .sec-title {
    font-family: 'Fraunces', serif;
    font-size: 1.75rem;
    font-weight: 300;
    color: var(--text-primary);
    line-height: 1.2;
  }
  .sec-meta-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  .q-range-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-muted);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 4px 12px;
    border-radius: 8px;
  }

  /* ── Cards ── */
  .q-grid { display: flex; flex-direction: column; gap: 14px; }

  .q-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 11px;
    overflow: hidden;
    transition: border-color 0.18s, box-shadow 0.18s;
    animation: slideUp 0.28s ease both;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .q-card:hover { border-color: #2a3548; box-shadow: 0 6px 28px rgba(0,0,0,0.35); }
  .q-card.open { border-color: #2a3a52; }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 18px;
    cursor: pointer;
    user-select: none;
  }
  .q-num-wrap { flex-shrink: 0; margin-top: 1px; }
  .q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    display: block;
  }
  .q-center { flex: 1; min-width: 0; }
  .q-title {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1.5;
    margin-bottom: 7px;
  }
  .q-pills { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }

  .pill {
    font-size: 0.63rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .pill-microsoft { background: #0f2340; color: #60a5fa; }
  .pill-amazon    { background: #2a1800; color: #fb923c; }
  .pill-accenture { background: #1e0a35; color: #c084fc; }
  .pill-infosys   { background: #052016; color: #4ade80; }
  .pill-tcs       { background: #1f1a00; color: #fde68a; }
  .pill-deloitte  { background: #00152a; color: #7dd3fc; }
  .pill-all       { background: #1a2535; color: #94a3b8; }
  .pill-default   { background: rgba(255,255,255,0.05); color: var(--text-secondary); }
  .pill-round {
    background: rgba(255,255,255,0.04);
    color: var(--text-muted);
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
    font-size: 0.67rem;
  }

  .expand-icon {
    flex-shrink: 0;
    width: 26px; height: 26px;
    border-radius: 7px;
    background: rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    transition: background 0.15s, color 0.15s, transform 0.22s;
    margin-top: 1px;
  }
  .q-card.open .expand-icon {
    transform: rotate(180deg);
    background: var(--active-card-dim, var(--accent-dim));
    color: var(--active-card-color, var(--accent));
  }

  .q-body {
    display: none;
    border-top: 1px solid var(--card-border);
  }
  .q-card.open .q-body { display: block; }
  .q-body-inner {
    padding: 18px 20px 20px;
    font-size: 0.875rem;
    line-height: 1.78;
    color: var(--text-secondary);
  }

  /* body elements */
  .lbl {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin: 16px 0 6px;
  }
  .lbl:first-child { margin-top: 0; }
  .bul {
    display: flex; gap: 9px; align-items: flex-start;
    margin: 3px 0;
    color: var(--text-secondary);
  }
  .bul-dot {
    flex-shrink: 0;
    width: 5px; height: 5px; border-radius: 50%;
    margin-top: 8px;
    background: var(--active-card-color, var(--accent));
    opacity: 0.7;
  }
  pre {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    background: var(--code-bg);
    border: 1px solid #151d28;
    border-radius: 8px;
    color: #93c5fd;
    padding: 14px 16px;
    margin: 12px 0;
    overflow-x: auto;
    white-space: pre;
    line-height: 1.65;
  }
  .tip {
    background: rgba(251,191,36,0.07);
    border-left: 3px solid #d97706;
    border-radius: 0 8px 8px 0;
    padding: 11px 15px;
    margin: 12px 0;
    font-size: 0.85rem;
    color: #fde68a;
    line-height: 1.6;
  }
  .answer-box {
    background: rgba(74,222,128,0.06);
    border-left: 3px solid #16a34a;
    border-radius: 0 8px 8px 0;
    padding: 11px 15px;
    margin: 12px 0;
    font-size: 0.85rem;
    color: #86efac;
    line-height: 1.6;
  }

  /* ── Welcome screen ── */
  .welcome { max-width: 820px; }
  .welcome-eyebrow {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--text-muted);
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .welcome-eyebrow::before {
    content: '';
    display: block;
    width: 24px; height: 1px;
    background: var(--text-muted);
  }
  .welcome-title {
    font-family: 'Fraunces', serif;
    font-size: 2.6rem;
    font-weight: 300;
    line-height: 1.15;
    color: var(--text-primary);
    margin-bottom: 16px;
  }
  .welcome-title em {
    font-style: italic;
    color: var(--accent);
  }
  .welcome-desc {
    font-size: 0.9rem;
    color: var(--text-secondary);
    line-height: 1.75;
    max-width: 580px;
    margin-bottom: 40px;
  }
  .chapter-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 36px;
  }
  .chapter-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: border-color 0.18s, transform 0.18s, box-shadow 0.18s;
    position: relative;
    overflow: hidden;
  }
  .chapter-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--card-accent);
  }
  .chapter-card:hover {
    border-color: #2a3548;
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .card-ch-num {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
  }
  .card-ch-name {
    font-family: 'Fraunces', serif;
    font-size: 1.05rem;
    font-weight: 300;
    color: var(--text-primary);
    margin-bottom: 12px;
    line-height: 1.3;
  }
  .card-ch-count {
    font-size: 2.2rem;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 2px;
  }
  .card-ch-label { font-size: 0.75rem; color: var(--text-muted); }
  .welcome-hint {
    font-size: 0.8rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .welcome-hint svg { opacity: 0.4; }

  /* ── Search results ── */
  .result-bar {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .result-bar strong { color: var(--text-secondary); }
  .result-bar .r-count { color: var(--accent); font-weight: 700; font-size: 1rem; }
  .ch-divider {
    margin: 28px 0 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }
  .ch-divider-line { flex: 1; height: 1px; background: var(--card-border); }

  /* empty */
  .empty {
    text-align: center;
    padding: 100px 20px;
    color: var(--text-muted);
  }
  .empty-icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.3; }
  .empty h3 { font-size: 1.05rem; color: var(--text-secondary); margin-bottom: 6px; }
  .empty p { font-size: 0.85rem; }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <span class="logo-main">MNC Interview Q&amp;A</span>
    <span class="logo-tag">CH 8 – 12</span>
  </div>
  <div class="search-wrap">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Search questions, topics, companies…" oninput="handleSearch(this.value)" autocomplete="off">
    <span class="kbd">⌘K</span>
  </div>
  <div class="header-right">
    <div class="ch-dots" id="chDots"></div>
    <div class="stat-badge" id="statBadge">234 Questions</div>
  </div>
</header>

<!-- SIDEBAR -->
<aside id="sidebar"></aside>

<!-- MAIN -->
<main id="main"></main>

<script>
const DATA = [{"title": "CHAPTER 8 – CI/CD, DOCKER & AZURE (DEVOPS FOR FULL-STACK)", "sections": [{"title": "🔹 Enterprise DevOps Concepts (Q621–Q680)", "questions": [{"id": "Q621", "meta": "Infosys / TCS – Screening Round", "title": "What is CI/CD in simple words? Easy Explanation", "body": "CI/CD means automating build, testing, and deployment so software reaches users\nsafely and faster.\n✔ CI – Continuous Integration\nDevelopers frequently merge code → code is built & tested automatically.\n✔ CD – Continuous Deployment\nCode is automatically deployed to environments without manual steps.\nReal-World Example\nEvery code push triggers pipeline:\nBuild → Test → Quality checks → Deploy to Server\nNo manual copying files, no “it works on my machine” mistakes.\n"}, {"id": "Q622", "meta": "Accenture – Interview Favorite", "title": "Difference between CI and CD", "body": "CI (Continuous Integration)\tCD (Continuous Deployment)\nFrequently merging code\tAutomatically deploying code\nBuilds + runs tests\tReleases to environments\nDeveloper-focused\tOperations/Release-focused\nInterview Tip:\nSay: “CI/CD reduces manual effort and Easy error.”\n"}, {"id": "Q623", "meta": "Microsoft – Technical Round", "title": "Why is CI/CD critical in enterprise projects? Explanation", "body": "✔ Faster release cycles\n✔ Early bug detection\n✔ Consistent deployments\n✔ Easy rollback and recovery\n✔ Improves team productivity\nStrong Interview Line\n“CI/CD ensures reliability, confidence, and repeatable deployments.”\n"}]}, {"title": "🧪 BUILD & PIPELINE CONCEPTS", "questions": [{"id": "Q624", "meta": "Amazon – DevOps Round", "title": "What happens in a typical CI pipeline? Explanation", "body": "1\tCode checkout\n2\tRestore dependencies\n3\tBuild application\n4\tRun tests\nCode quality scan Generate artifacts\nArtifacts = packaged build ready for deployment.\n"}, {"id": "Q625", "meta": "Accenture – Technical Round", "title": "Example: .NET CI pipeline steps", "body": "dotnet restore dotnet build dotnet test dotnet publish\nReal Usage\nExecuted through:\n●\tAzure DevOps\n●\tGitHub Actions\n●\tJenkins\n"}]}, {"title": "🧠 GIT & BRANCHING STRATEGY", "questions": [{"id": "Q626", "meta": "Microsoft – Interview Favorite", "title": "What branching strategy do you use? Explanation", "body": "Most enterprises use:\n✔ GitFlow\n●\tdevelop\n●\tfeature branches\n●\trelease\n●\thotfix\n✔ Trunk-based development\nSmall frequent merges → continuous delivery.\n"}, {"id": "Q627", "meta": "Deloitte – Senior Round", "title": "Why are Pull Requests mandatory in MNCs? Explanation", "body": "Pull Requests ensure:\n✔ Code review\n✔ Quality checks\n✔ Security scans\n✔ Peer validation\nResult → Better code + fewer bugs.\n🐳 DOCKER (VERY IMPORTANT)\n"}, {"id": "Q628", "meta": "Amazon – Interview Favorite", "title": "What is Docker and why do we need it? Easy Explanation", "body": "Docker packages:\nApplication + Dependencies + Runtime → into a container. So the app runs the same everywhere.\nIt kills the problem:\n“Works on my machine but not on the server.”\n"}, {"id": "Q629", "meta": "Microsoft – Technical Round", "title": "Difference between Virtual Machine and Docker", "body": "Virtual Machine\tDocker\nHeavy\tLightweight\nSeparate OS\tShares OS\nSlow startup\tFast startup\nMore resource usage\tLess resource usage\n"}, {"id": "Q630", "meta": "Accenture – Developer Round", "title": "What is a Dockerfile?", "body": "A Dockerfile defines how to build an image.\nReal Example (.NET API)\nFROM mcr.microsoft.com/dotnet/aspnet:7.0 WORKDIR /app\nCOPY . .\nENTRYPOINT [\"dotnet\", \"MyApi.dll\"]\n"}, {"id": "Q631", "meta": "Microsoft – Advanced Round", "title": "Docker Image vs Container", "body": "✔ Image → Blueprint or template\n✔ Container → Running instance of the image\n"}]}, {"title": "🧠 DOCKER REAL PROJECT SCENARIOS", "questions": [{"id": "Q632", "meta": "Amazon – Scenario Based", "title": "Why is Docker useful in microservices? Explanation", "body": "Each service:\n✔ Runs independently\n✔ Has its own dependencies\n✔ Can scale separately Perfect for cloud & Kubernetes.\n"}, {"id": "Q633", "meta": "Accenture – Interview Favorite", "title": "How does Docker help CI/CD pipelines? Explanation", "body": "✔ Same environment across Dev, QA, Prod\n✔ Faster deployments\n✔ Easy rollback\n✔ No configuration issues\n☁ AZURE BASICS (MNC MUST)\n"}, {"id": "Q634", "meta": "Microsoft – Technical Round", "title": "What is Microsoft Azure? Explanation", "body": "Azure is a cloud platform providing:\n✔ Compute\n✔ Storage\n✔ Databases\n✔ Networking\n✔ DevOps tools\nUsed to host and scale applications globally.\n"}, {"id": "Q635", "meta": "Accenture – Interview Favorite", "title": "Azure vs AWS – which one do you use and why? Balanced Answer", "body": "Azure is best when:\n✔ .NET applications\n✔ Enterprise ecosystem\n✔ Integration with Active Directory\nAWS is amazing for:\n✔ Cloud-native\n✔ High-scale distributed systems\n"}]}, {"title": "🧠 AZURE CORE SERVICES", "questions": [{"id": "Q636", "meta": "Microsoft – Technical Round", "title": "What is Azure App Service? Explanation", "body": "Managed hosting platform for:\n●\tWeb Apps\n●\tAPIs\n●\tBackground services\nNo server maintenance needed.\n"}, {"id": "Q637", "meta": "Amazon – Architecture Round", "title": "Azure App Service vs Virtual Machine", "body": "App Service\tVirtual Machine\nFully managed\tFull control\nAuto scaling\tManual setup\nLess Ops work\tMore Ops work\n"}]}, {"title": "🧪 AZURE DEVOPS (VERY IMPORTANT)", "questions": [{"id": "Q638", "meta": "Accenture – Interview Favorite", "title": "What is Azure DevOps? Explanation", "body": "Azure DevOps provides:\n✔ Repos\n✔ Pipelines\n✔ Boards\n✔ Artifacts\nComplete DevOps ecosystem.\n"}, {"id": "Q639", "meta": "Microsoft – Technical Round", "title": "Azure Pipeline Example (.NET)", "body": "trigger:\n-\tmain\nsteps:\n-\ttask: DotNetCoreCLI@2 inputs:\ncommand: 'build'\n"}]}, {"title": "🧠 DEPLOYMENT STRATEGIES", "questions": [{"id": "Q640", "meta": "Amazon – Senior Round", "title": "Blue-Green vs Rolling Deployment", "body": "✔ Blue-Green\nTwo environments (Blue & Green) Switch traffic instantly → zero downtime\n✔ Rolling Deployment\nGradually updates instances → safer rollout\n"}]}, {"title": "🔐 SECURITY IN DEVOPS", "questions": [{"id": "Q641", "meta": "Microsoft – Security Round", "title": "How do you secure secrets in CI/CD?", "body": "✔ Azure Key Vault\n✔ Pipeline secret variables\n✔ Never store in code\n"}, {"id": "Q642", "meta": "Accenture – Interview Favorite", "title": "What is Azure Key Vault?", "body": "Stores:\n●\tPasswords\n●\tAPI Keys\n●\tCertificates\n●\tConnection Strings\nCentralized & secure.\n"}]}, {"title": "🧠 MONITORING & LOGGING", "questions": [{"id": "Q643", "meta": "Amazon – Observability Round", "title": "How do you monitor applications in Azure?", "body": "✔ Azure Monitor\n✔ Application Insights\n✔ Alerts + Dashboards\n"}, {"id": "Q644", "meta": "Microsoft – Technical Round", "title": "What is Application Insights?", "body": "Tracks:\n●\tRequests\n●\tErrors\n●\tPerformance\n●\tDependencies\nHelps debug production issues.\n"}]}, {"title": "⚙ SCALING & PERFORMANCE", "questions": [{"id": "Q645", "meta": "Accenture – Scenario Based", "title": "How do you scale an API in Azure?", "body": "✔ Horizontal scaling (scale out)\n✔ Auto-scale rules (CPU / Requests threshold)\n"}]}, {"title": "🧠 REAL INTERVIEW SCENARIOS", "questions": [{"id": "Q646", "meta": "Deloitte – Scenario", "title": "Deployment failed in production – what do you do?", "body": "1\tRollback safely\n2\tCheck logs & pipeline\n3\tFix issue\n4\tRedeploy\nShows maturity & ownership.\n"}, {"id": "Q647", "meta": "Amazon – Senior Round", "title": "How CI/CD reduced bugs in your project?", "body": "Talk about:\n✔ Early testing\n✔ Automated quality gates\n✔ Consistent deployments\n✔ Reduced Easy mistakes\n"}]}, {"title": "🏁 FINAL DEVOPS QUESTIONS", "questions": [{"id": "Q648", "meta": "Microsoft – Final Round", "title": "Explain end-to-end CI/CD for .NET + React app", "body": "(Talk about Repo → Pipeline → Docker → Azure App Service → Monitoring)\n"}, {"id": "Q649", "meta": "Accenture – HR + Tech", "title": "Biggest CI/CD challenge you solved", "body": "(E.g., rollback automation, build failures, environment config issues)\n"}, {"id": "Q650", "meta": "ALL MNCs – FINAL DEVOPS QUESTION", "title": "Why is DevOps important for Full-Stack Developers?", "body": "Best Interview Answer\n“Because full-stack developers must know how code is built, validated, deployed, monitored, and scaled in real production environments. CI/CD + DevOps ensures faster delivery, fewer failures, and reliable systems.”\n"}]}]}, {"title": "CHAPTER 9 – CLOUD & AZURE (DEEP INTERVIEW LEVEL)", "sections": [{"title": "🔹 Azure Architecture, Services & Real-World Scenarios (Q681–Q720)", "questions": [{"id": "Q681", "meta": "TCS / Infosys – Screening Round", "title": "What is Cloud Computing in simple words? Easy explanation", "body": "Cloud computing means using servers over the internet instead of buying and maintaining\nphysical machines.\nYou do not worry about:\n●\thardware\n●\tmaintenance\n●\telectricity\n●\tdata center space\nAnd…\nYou pay only for what you use.\nReal-world example\nInstead of hosting your API on a company server, you host it on Azure App Service / AWS EC2.\n"}, {"id": "Q682", "meta": "Accenture – Interview Favorite", "title": "IaaS vs PaaS vs SaaS with real examples", "body": "Model\tMeaning\tWho manages?\tAzure Example\nIaaS\nInfrastructure as a Service\nYou manage OS + App\nAzure VM\nPaaS\tPlatform as a Service\tAzure manages infra\tAzure App Service\nSaaS\nSoftware as a Service\nEverything managed\nOffice 365\nInterview Tip\nSay confidently:\n“Most .NET applications in enterprises prefer PaaS because it reduces infrastructure effort.”\n"}]}, {"title": "🧠 AZURE CORE ARCHITECTURE", "questions": [{"id": "Q683", "meta": "Microsoft – Technical Round", "title": "What is a Resource Group in Azure? Explanation", "body": "A Resource Group is a logical container that holds Azure resources like:\n●\tApp Service\n●\tDatabase\n●\tStorage\n●\tVM\nReal-world usage\nDelete the entire environment (API + Database + Storage) in one click.\n"}, {"id": "Q684", "meta": "Deloitte – Senior Round", "title": "Azure Region vs Availability Zone", "body": "Explanation\n✔ Region\nGeographic location (e.g., East US, Central India)\n✔ Availability Zone\nMultiple independent data centers inside a region.\nWhy it matters\nHigh availability Disaster recovery Fault tolerance\n"}]}, {"title": "🏗 COMPUTE SERVICES (VERY IMPORTANT)", "questions": [{"id": "Q685", "meta": "Microsoft – Interview Favorite", "title": "Azure App Service vs Azure VM – which to choose? Easy explanation", "body": "Choose App Service when:\n●\tYou want fast deployment\n●\tMinimum infrastructure work\n●\tBuilt-in scaling and monitoring\nChoose VM when:\n●\tYou need full OS control\n●\tNeed to install custom software\n●\tNeed backend services not supported by PaaS\n"}, {"id": "Q686", "meta": "Amazon – Architecture Round", "title": "Azure App Service real production example Example", "body": "Host:\n●\tASP.NET Core API\n●\tReact/Angular frontend\nWith:\n●\tAuto scaling\n●\tHTTPS\n●\tDeployment slots\n●\tMonitoring\n"}]}, {"title": "🧠 AZURE FUNCTIONS (SERVERLESS)", "questions": [{"id": "Q687", "meta": "Accenture – Interview Favorite", "title": "What is Azure Function and why use it? Explanation", "body": "Azure Function lets you run small code pieces without servers.\n✔ No server management\n✔ Pay only when it runs\nReal-world example\nSend email after order placed Process background jobs Generate reports\n"}, {"id": "Q688", "meta": "Microsoft – Advanced Round", "title": "Azure Function vs Web API", "body": "Azure Function\tWeb API\nEvent-driven\nRequest-driven\nVery cheap\nContinuous cost\nServerless\nServer-based\n🗄 STORAGE & DATA SERVICES\n"}, {"id": "Q689", "meta": "Infosys – Technical Round", "title": "Types of Azure Storage", "body": "✔ Blob Storage → files, images, videos\n✔ Table Storage → NoSQL structured data\n✔ Queue Storage → message communication\n✔ File Storage → shared file system\n"}, {"id": "Q690", "meta": "Amazon – Scenario Based", "title": "Store user-uploaded images – which Azure service?", "body": "Answer: Azure Blob Storage\nWhy: Cheap, scalable, secure, globally available\n"}]}, {"title": "🧠 DATABASES IN AZURE", "questions": [{"id": "Q691", "meta": "Microsoft – Interview Favorite", "title": "Azure SQL vs SQL Server on VM Explanation", "body": "✔ Azure SQL\n●\tFully managed\n●\tAuto backups\n●\tAuto scaling\n✔ SQL Server on VM\n●\tFull control\n●\tManual backup & maintenance\n"}, {"id": "Q692", "meta": "Deloitte – Senior Round", "title": "Azure Cosmos DB – when to use it? Use when", "body": "●\tGlobal distribution required\n●\tUltra-low latency\n●\tMassive scalability\nReal-world example\nIoT\nGaming telemetry Large-scale apps\n"}]}, {"title": "🔐 SECURITY & IDENTITY", "questions": [{"id": "Q693", "meta": "Microsoft – Security Round", "title": "What is Azure Active Directory (AAD)?", "body": "Handles:\n✔ Authentication\n✔ Authorization\n✔ Single Sign-On\nReal use\nLogin with Microsoft / Organizational account.\n"}, {"id": "Q694", "meta": "Accenture – Interview Favorite", "title": "Managed Identity – why important?", "body": "Allows apps to access Azure resources without storing credentials.\nReal use\nApp Service accessing Key Vault securely.\n"}]}, {"title": "🔑 AZURE KEY VAULT", "questions": [{"id": "Q695", "meta": "Microsoft – Advanced Round", "title": "Why is Azure Key Vault mandatory in enterprises?", "body": "Stores:\n●\tSecrets\n●\tKeys\n●\tCertificates\nPrevents:\n❌ Hardcoding passwords\n❌ Storing secrets in config files\n"}]}, {"title": "🧠 NETWORKING (INTERVIEW FAVORITE)", "questions": [{"id": "Q696", "meta": "Amazon – Architecture Round", "title": "What is Azure Virtual Network (VNet)?", "body": "A secure private network inside Azure.\nReal-world usage\nSecure communication between:\n●\tApp Service\n●\tDatabase\n●\tVMs\n"}, {"id": "Q697", "meta": "Microsoft – Advanced", "title": "Public Endpoint vs Private Endpoint", "body": "✔ Public endpoint = accessible via internet\n✔ Private endpoint = accessible only inside Azure network Better security, no exposure.\n"}]}, {"title": "📊 MONITORING & LOGGING", "questions": [{"id": "Q698", "meta": "Accenture – Real Project", "title": "How do you monitor Azure applications?", "body": "Use:\n✔ Azure Monitor\n✔ Application Insights Tracks:\n●\tFailures\n●\tLogs\n●\tPerformance\n●\tUser behavior\n"}, {"id": "Q699", "meta": "Microsoft – Advanced Round", "title": "What metrics do you monitor in production?", "body": "✔ CPU\n✔ Memory\n✔ Response time\n✔ Error rate\n✔ Throughput\nShows the real health of the app.\n"}]}, {"title": "⚙ SCALABILITY & RESILIENCE", "questions": [{"id": "Q700", "meta": "Amazon – Senior Round", "title": "How does auto-scaling work in Azure App Service?", "body": "Azure automatically adds/removes instances based on:\n●\tCPU % usage\n●\tRequest count\n●\tSchedule rules\nReduces cost + improves performance.\n🔁 DISASTER RECOVERY & BACKUP\n"}, {"id": "Q701", "meta": "Deloitte – Senior Round", "title": "How do you design DR strategy in Azure?", "body": "✔ Multi-region deployment\n✔ Backups enabled\n✔ Geo-replication\n✔ Failover testing\n"}]}, {"title": "🧠 CLOUD COST MANAGEMENT", "questions": [{"id": "Q702", "meta": "Accenture – Interview Favorite", "title": "How do you reduce Azure cloud cost?", "body": "✔ Auto-scale\n✔ Right-size resources\n✔ Shut unused services\n✔ Reserved instances\n"}]}, {"title": "🧪 REAL INTERVIEW SCENARIOS", "questions": [{"id": "Q703", "meta": "Amazon – Scenario Based", "title": "The app works locally but fails in Azure – why?", "body": "Common reasons:\n●\tMissing configuration\n●\tWrong connection strings\n●\tFirewall / networking\n●\tEnvironment variables missing\n"}, {"id": "Q704", "meta": "Microsoft – Debugging", "title": "How do you debug production issues in Azure?", "body": "Use:\n✔ Logs\n✔ App Insights traces\n✔ Failure diagnostics\n"}]}, {"title": "🏗 ARCHITECTURE DECISIONS", "questions": [{"id": "Q705", "meta": "Deloitte – Architecture Round", "title": "Monolith vs Microservices in Azure", "body": "Right answer:\nStart with monolith\nMove to microservices when app grows\nShows maturity.\n"}]}, {"title": "🔐 SECURITY BEST PRACTICES", "questions": [{"id": "Q706", "meta": "Microsoft – Security", "title": "How do you secure APIs in Azure?", "body": "✔ Azure AD Auth\n✔ Azure API Management\n✔ HTTPS enforced\n✔ Key Vault secrets\n"}]}, {"title": "🧠 AZURE API MANAGEMENT", "questions": [{"id": "Q707", "meta": "Accenture – Interview Favorite", "title": "What is Azure API Management?", "body": "Gateway to provide:\n●\tRate limiting\n●\tAuthentication\n●\tMonitoring\n●\tAnalytics\n"}]}, {"title": "🧠 CI/CD + AZURE", "questions": [{"id": "Q708", "meta": "Microsoft – Advanced", "title": "How does CI/CD integrate with Azure?", "body": "Pipeline:\nBuild → Test → Deploy → Monitor\nTools:\nAzure DevOps / GitHub Actions\n"}]}, {"title": "🧪 CLOUD MIGRATION", "questions": [{"id": "Q709", "meta": "Amazon – Senior Round", "title": "Challenges while migrating to Azure", "body": "✔ Data migration\n✔ Downtime planning\n✔ Security & networking\n✔ Cost estimation\n"}]}, {"title": "🧠 COMPLIANCE & GOVERNANCE", "questions": [{"id": "Q710", "meta": "Deloitte – Compliance Round", "title": "How does Azure support compliance?", "body": "Supports: GDPR ISO HIPAA SOC\nBuilt-in certifications.\n"}]}, {"title": "🏁 FINAL CLOUD QUESTIONS", "questions": [{"id": "Q711", "meta": "Microsoft – Final Round", "title": "Explain Azure architecture of your project", "body": ""}, {"id": "Q712", "meta": "Accenture – HR + Tech", "title": "Biggest cloud mistake you fixed", "body": ""}, {"id": "Q713", "meta": "Amazon – Reflection", "title": "When not to use the cloud? Example:", "body": "Very small apps\nHigh offline security environments\nQ714–Q719 (Scenario + Hands-on Mix)\n✔ Secure secrets\n✔ Handle traffic spike\n✔ Unexpected bill increase\n✔ Multi-region strategy\n✔ Failover planning\n"}, {"id": "Q720", "meta": "ALL MNCs – FINAL CLOUD QUESTION", "title": "Why is cloud knowledge mandatory for Full-Stack Developers?", "body": "Best Interview Answer\n“Because modern applications are built, deployed, scaled, secured, and monitored in the cloud. Without cloud knowledge, a developer cannot design real-world production-ready systems.”\n"}]}]}, {"title": "CHAPTER 10 – HR & SCENARIO-BASED MNC QUESTIONS", "sections": [{"title": "🔹 Behavioral, Managerial & Real-World Scenarios (Q721–Q780)", "questions": [{"id": "Q721", "meta": "ALL MNCs – FIRST QUESTION", "title": "Tell me about yourself.", "body": "Easy, Ready-to-Speak Answer\n“I am a Full-Stack Developer with solid experience in .NET, C#, React, Angular, and SQL. I’ve worked on building scalable Web APIs, modern front-end applications, and cloud-based solutions on Azure.\nI enjoy solving real business problems, improving system performance, and writing clean, maintainable code. I’ve also worked closely with teams, participated in architecture discussions, and contributed to production deployments.\nCurrently, I’m looking for a challenging opportunity where I can contribute to large-scale enterprise applications and continue growing technically.”\nInterview Tip\nKeep it 2 minutes max.\nDo not talk about family, schooling, or personal life unless asked.\n"}, {"id": "Q722", "meta": "Accenture – HR Round", "title": "Why do you want to join our company?", "body": "Best Easy Answer\n“Your company works on large-scale enterprise projects and follows modern engineering practices like cloud, microservices, and DevOps. I see a strong learning environment and an opportunity to work with experienced teams while contributing real value to impactful projects.”\n"}, {"id": "Q723", "meta": "Infosys – HR Favorite", "title": "Why should we hire you?", "body": "Answer\n“I bring a strong combination of technical expertise, problem-solving mindset, and real project experience. I don’t just deliver code—I understand business impact, performance, scalability, and production stability. I take ownership and ensure work is completed with quality and reliability.”\n"}]}, {"title": "🧠 WORK ETHIC & OWNERSHIP", "questions": [{"id": "Q724", "meta": "Amazon – Leadership Principle", "title": "Describe a challenging problem you solved. STAR Answer", "body": "Situation: Our API response was slow and affecting user experience.\nTask: Improve performance and reduce latency.\nAction: Implemented database indexes, caching, async calls, and optimized queries.\nResult: Response time improved by ~60% and the system became more stable.\n"}, {"id": "Q725", "meta": "Microsoft – Scenario", "title": "What do you do if you don’t know the answer to a technical question?", "body": "Honest Answer\n“I acknowledge it, explain how I would analyze and troubleshoot it, research the best approach, and come back with a well-tested solution. I believe honesty + learning mindset is more valuable than guessing.”\n"}, {"id": "Q726", "meta": "Deloitte – HR Round", "title": "How do you handle pressure or tight deadlines?", "body": "Answer\n“I prioritize tasks, break them into manageable parts, stay focused, and communicate early if any risk appears. Instead of panicking, I stay structured and ensure delivery without compromising quality.”\n"}]}, {"title": "🔄 TEAMWORK & CONFLICT", "questions": [{"id": "Q727", "meta": "Accenture – Behavioral", "title": "Describe a conflict with a teammate.", "body": "Answer\n“We had different opinions on implementation. Instead of arguing, I proposed creating a small POC. We compared results objectively and chose the best option. This kept the team in harmony and delivered the right solution.”\n"}, {"id": "Q728", "meta": "Amazon – Leadership", "title": "How do you handle disagreement with your manager?", "body": "Answer\n“I present data, examples, and explain my viewpoint respectfully. If the final decision is different, I support it completely because alignment is important for team success.”\n"}]}, {"title": "🧠 FAILURE & LEARNING", "questions": [{"id": "Q729", "meta": "Microsoft – Behavioral", "title": "Describe a mistake you made and what you learned.", "body": "Answer\n“I once deployed without sufficient testing, which caused a rollback. I learned the value of strong testing, reviews, and validation. Since then, I always ensure stability before delivery.”\n"}, {"id": "Q730", "meta": "Infosys – HR Favorite", "title": "Have you ever missed a deadline?", "body": "Answer\n“Yes. Due to underestimated complexity. I informed stakeholders early, adjusted the plan, and delivered a stable solution shortly after. Communication and transparency helped maintain trust.”\n"}]}, {"title": "🚀 GROWTH & MOTIVATION", "questions": [{"id": "Q731", "meta": "Accenture – HR Round", "title": "Where do you see yourself in 5 years?", "body": "Answer\n“As a senior engineer or technical lead working on scalable systems, guiding architecture decisions, and mentoring juniors.”\n"}, {"id": "Q732", "meta": "Amazon – Leadership", "title": "How do you stay updated with technology?", "body": "Answer\n“By following documentation, experimenting hands-on, studying production learnings, participating in discussions, and continuously learning from real-world challenges.”\n"}]}, {"title": "🧠 ETHICS & RESPONSIBILITY", "questions": [{"id": "Q733", "meta": "Deloitte – Compliance", "title": "What would you do if you found a security issue in production?", "body": "Answer\n“Immediately report and assess impact, secure the system, fix or rollback safely, communicate with stakeholders, and ensure preventive measures are documented.”\n🔥 REAL PROJECT SCENARIOS\n"}, {"id": "Q734", "meta": "Amazon – Scenario Based", "title": "Production is down. What do you do? Answer", "body": "1.\tUnderstand impact\n2.\tRollback if required\n3.\tCheck logs & monitoring\n4.\tFix root cause\n5.\tImplement prevention steps\n"}, {"id": "Q735", "meta": "Microsoft – Scenario", "title": "Clients want a risky feature that affects system stability.", "body": "Answer\n“I explain risks clearly, suggest a safer alternative, and help them understand long-term impact before proceeding.”\n"}]}, {"title": "🧩 TIME & PRIORITY MANAGEMENT", "questions": [{"id": "Q736", "meta": "Infosys – HR Round", "title": "How do you prioritize tasks?", "body": "Answer\n“Based on business value, deadlines, dependencies, risk, and impact to users.”\n"}]}, {"title": "🧠 WORK STYLE & CULTURE FIT", "questions": [{"id": "Q737", "meta": "Accenture – HR", "title": "Do you prefer working alone or in a team?", "body": "Answer\n“I can work independently when required, but I believe teams create better solutions and learning happens together.”\n💼 CAREER DECISIONS\n"}, {"id": "Q738", "meta": "ALL MNCs", "title": "Why are you leaving your current company?", "body": "Safe Answer\n“I am looking for better learning opportunities, exposure to large systems, and a place where I can grow long-term.”\nGolden Rule\n❌ Never badmouth current employer.\n"}]}, {"title": "🧠 ETHICAL SCENARIOS", "questions": [{"id": "Q739", "meta": "Deloitte – Ethics", "title": "What if your teammate takes credit for your work?", "body": "Answer\n“I will address it calmly, clarify contributions professionally, and involve the manager only if required. I believe in fairness without conflict.”\n"}]}, {"title": "🧪 TECH + HR MIX", "questions": [{"id": "Q740", "meta": "Microsoft – Hybrid", "title": "Explain a technical concept to a non-tech person.", "body": "Example\n“An API is like a waiter. You request food, the waiter takes it to the kitchen, and brings the response back. API does the same between app and server.”\n"}]}, {"title": "🧠 LEADERSHIP & MENTORSHIP", "questions": [{"id": "Q741", "meta": "Amazon – Leadership", "title": "Have you mentored anyone?", "body": "Answer\n“Yes, I’ve supported juniors in understanding system design, debugging issues, writing cleaner code, and learning best practices.”\n"}]}, {"title": "🏁 FINAL HR QUESTIONS", "questions": [{"id": "Q742", "meta": "Accenture – Final HR", "title": "What are your strengths and weaknesses? Answer", "body": "Strength: Problem solving, ownership, learning mindset.\nWeakness: Sometimes over-focus on perfection—working to balance speed + quality.\n"}, {"id": "Q743", "meta": "Microsoft – Final Round", "title": "What motivates you?", "body": "“Building meaningful systems, solving challenges, and seeing my work deliver real business value.”\n"}, {"id": "Q744", "meta": "Deloitte – HR", "title": "How do you handle feedback?", "body": "“I take feedback positively, analyze it, improve, and ensure mistakes do not repeat.”\n"}, {"id": "Q745", "meta": "Amazon – Culture Fit", "title": "Describe a time you went beyond your role.", "body": "Example: Stayed extra to stabilize production or helped another team deliver critical functionality.\n"}]}, {"title": "🧠 COMMON HR TRAPS", "questions": [{"id": "Q746", "meta": "ALL MNCs", "title": "Do you have any questions for us? Always Ask", "body": "●\tWhat tech stack does the team use?\n●\tHow is success measured?\n●\tWhat growth opportunities exist?\nNever say:\n❌ “No questions”\n🔁 ADVANCED SCENARIO QUESTIONS (Q747–Q779)\n"}, {"id": "Q747", "meta": "Amazon – Leadership", "title": "How will you handle layoffs impacting your team productivity?", "body": "Answer\n“I would first ensure team morale stays stable by communicating transparently, clarifying priorities, and ensuring no panic. I would help redistribute responsibilities, identify critical tasks, and avoid burnout through realistic planning.”\nKey Thought Process\nStability → Communication → Prioritization → Execution\n"}, {"id": "Q748", "meta": "Microsoft – Behavioral", "title": "How do you work across different time zones?", "body": "Answer\n“I plan communication windows, keep documentation strong, use async communication tools, and ensure clarity in tasks. I avoid dependency bottlenecks by planning ahead.”\n"}, {"id": "Q749", "meta": "Accenture – Delivery Scenario", "title": "You missed sprint goals twice; what will you do?", "body": "Answer\n“I’d analyze why: underestimation, dependencies, or unknown complexity. Then I’d improve estimation accuracy, communicate early, break tasks better, and ensure realistic planning moving forward.”\n"}, {"id": "Q750", "meta": "Deloitte – Client Facing", "title": "Client escalated due to delay—how do you handle it?", "body": "Answer\n“I would acknowledge the concern, explain the real reason without blaming anyone, present a revised clear plan, and ensure frequent updates. The goal is regaining trust, not arguments.”\n"}, {"id": "Q751", "meta": "Amazon – Ownership Principle", "title": "A teammate isn’t performing; how do you handle it?", "body": "Answer\n“I support first: understand the challenge, guide them, and collaborate. If performance continues to affect delivery, I escalate professionally to ensure team success.”\n"}, {"id": "Q752", "meta": "Microsoft – Communication Skill", "title": "Explain a complex technical issue to a non-technical stakeholder", "body": "Answer Example\n“Instead of saying ‘server latency due to thread blocking’, I’ll say ‘the system is taking time because requests are queuing; we’re optimizing to respond faster.’ Clear, simple, and meaningful.”\n"}, {"id": "Q753", "meta": "Accenture – Reality Check", "title": "What if product requirements keep changing?", "body": "Answer\n“I would encourage stable requirement baselines, involve product owners, and ensure proper sprint planning. Continuous changes kill productivity, so structured change handling is key.”\n"}, {"id": "Q754", "meta": "Infosys – Team Discipline", "title": "The team is not following coding standards—what will you do?", "body": "Answer\n“Introduce code reviews, automated linting, best practices sessions, and leadership alignment. Standards maintain quality.”\n"}, {"id": "Q755", "meta": "Amazon – Pressure Handling", "title": "Production down during the weekend—what do you do?", "body": "Answer\n“Immediately respond, assess impact, fix or rollback, ensure communication, then follow with root-cause analysis. Stability first.”\n"}, {"id": "Q756", "meta": "Microsoft – Time Management", "title": "You have multiple high-priority tasks. What do you do?", "body": "Answer\n“Prioritize by business impact, deadlines, dependencies, and risk. Communicate if timelines clash. Structured prioritization ensures the right outcomes.”\n"}, {"id": "Q757", "meta": "Deloitte – Ownership", "title": "You finished your work early; what next?", "body": "Answer\n“I help my team, improve code, review system performance, or enhance documentation. Ownership continues beyond completion.”\n"}, {"id": "Q758", "meta": "Amazon – Leadership Reflection", "title": "Describe a time you took initiative without being asked", "body": "Answer\n“Once I identified performance risk before release. I optimized queries proactively which prevented potential production issues.”\n"}, {"id": "Q759", "meta": "Microsoft – Real Delivery Scenario", "title": "How do you handle last-minute requirement changes?", "body": "Answer\n“Evaluate impact, communicate feasibility and risks, provide alternatives, and ensure realistic delivery instead of rushing unstable code.”\n"}, {"id": "Q760", "meta": "Accenture – Conflict Resolution", "title": "Teammates disagree strongly; what do you do?", "body": "Answer\n“Encourage data-based discussion or small POC. Let results decide, not ego.”\n"}, {"id": "Q761", "meta": "Amazon – Bias for Action", "title": "You found a bug that others ignored", "body": "Answer\n“I validate impact, log it, communicate risk, and ensure it’s fixed before it becomes expensive.”\n"}, {"id": "Q762", "meta": "Microsoft – Ownership Culture", "title": "How do you ensure quality in your code?", "body": "Answer\n“Reviews, unit tests, clean architecture, scalability thinking, and defensive coding.”\n"}, {"id": "Q763", "meta": "Deloitte – Business Thinking", "title": "How do you balance speed vs quality?", "body": "Answer\n“I avoid shortcuts. I deliver fast but stable releases using automation and structured coding principles.”\n"}, {"id": "Q764", "meta": "Infosys – Learning Mindset", "title": "What is your biggest professional learning?", "body": "Answer\n“Production failures teach responsibility, testing, and design thinking more than tutorials ever can.”\n"}, {"id": "Q765", "meta": "Amazon – Ownership Reflection", "title": "Describe a time you worked beyond your responsibility", "body": "Answer\n“Handled deployment, helped support team, and ensured stability even though it wasn’t assigned to me. Ownership matters.”\n"}, {"id": "Q766", "meta": "Accenture – Leadership Round", "title": "How do you keep a team motivated?", "body": "Answer\n“Clarity, appreciation, collaboration, and celebrating wins.”\n"}, {"id": "Q767", "meta": "Microsoft – Accountability", "title": "Have you ever strongly disagreed with the final decision?", "body": "Answer\n“Yes, but once the decision was finalized, I supported it and ensured successful delivery.”\n"}, {"id": "Q768", "meta": "Deloitte – Production Impact", "title": "How do you prevent repeating mistakes?", "body": "Answer\n“Root cause analysis, documentation, automation, and preventive checks.”\n"}, {"id": "Q769", "meta": "Amazon – Production Priority", "title": "Feature release vs stability issue — what do you pick?", "body": "Answer\n“Stability first. A failing system kills business trust.”\n"}, {"id": "Q770", "meta": "Accenture – Professional Integrity", "title": "How do you handle unethical requests?", "body": "Answer\n“I refuse professionally, explain risks, and ensure integrity is maintained.”\n"}, {"id": "Q771", "meta": "Microsoft – Team Culture", "title": "How do you help new team members ramp up?", "body": "Answer\n“Documentation, mentorship, explaining architecture, and guiding patiently.”\n"}, {"id": "Q772", "meta": "Amazon – Ownership Real Case", "title": "Describe a tough leadership situation", "body": "Answer\n“Took responsibility for production issues, coordinated the team, communicated clearly, and restored the system successfully.”\n"}, {"id": "Q773", "meta": "Infosys – Problem Solving", "title": "How do you approach unknown technical issues?", "body": "Answer\n“Break it down → analyze logs → replicate issue → research → implement fix → validate.”\n"}, {"id": "Q774", "meta": "Deloitte – Pressure Handling", "title": "What if every task feels urgent?", "body": "Answer\n“Everything can’t be top priority. I align with stakeholders to define reality.”\n"}, {"id": "Q775", "meta": "Microsoft – Ownership & Growth", "title": "Biggest professional achievement?", "body": "(Example format interviewer expects)\n“Improving performance, reducing cost, saving downtime, or delivering major success.”\n"}, {"id": "Q776", "meta": "Amazon – Team Contribution", "title": "How do you ensure team success, not only personal success?", "body": "Answer\n“By helping, sharing knowledge, contributing to solutions, and maintaining healthy collaboration.”\n"}, {"id": "Q777", "meta": "Accenture – Leadership Reality", "title": "What if you are assigned a boring task?", "body": "Answer\n“I still deliver with the same quality. Consistency defines professionalism.”\n"}, {"id": "Q778", "meta": "Microsoft – Resilience", "title": "Describe a time you failed and bounced back", "body": "Answer\n“Deployment mistakes → learned → automated checks → improved maturity.”\n"}, {"id": "Q779", "meta": "Deloitte – Responsibility Under Pressure", "title": "What if business wants an impossible timeline?", "body": "Answer\n“I communicate realistic estimates, provide a phased delivery plan, and ensure the best feasible outcome without compromising quality.”\n"}, {"id": "Q780", "meta": "ALL MNCs – FINAL", "title": "Why should we trust you with critical systems?", "body": "Best Interview Answer\n“Because I take complete ownership, communicate transparently, focus on security and stability, and always ensure quality over shortcuts. I treat production systems with responsibility and respect.”\nChapter 11 – System Design (MNC Level)\nQ781 – Q840 (60 Questions)\n●\tLow-level design (LLD)\n●\tHigh-level design (HLD)\n●\tAPI design\n●\tScalability\n●\tCaching, load balancing\n●\tReal .NET + Azure examples\n👉 Very important for 5+ years, Amazon, Microsoft, Deloitte\n"}]}]}, {"title": "CHAPTER 11 – SYSTEM DESIGN (MNC INTERVIEW LEVEL)", "sections": [{"title": "🔹 Foundations of System Design (Q781–Q800)", "questions": []}, {"title": "🧠 SYSTEM DESIGN BASICS", "questions": [{"id": "Q781", "meta": "ALL MNCs – FIRST DESIGN QUESTION", "title": "What is System Design in simple words? Easy explanation", "body": "System Design means planning how a system will work before writing code.\nIt defines architecture, communication, scalability, storage, and reliability.\nIt answers\n●\tHow components interact\n●\tHow data flows\n●\tHow the system scales\n●\tHow failures are handled\nReal-life example\nBefore building an e-commerce platform, you decide: Frontend → React / Angular\nBackend APIs → .NET Core / Node Database → SQL\nCache → Redis Deployment → Azure / AWS Security → JWT / OAuth\nMonitoring → App Insights / CloudWatch This planning is system design.\n"}, {"id": "Q782", "meta": "Microsoft – Interview Favorite", "title": "Difference between Low-Level Design (LLD) and High-Level Design (HLD)", "body": "HLD\tLLD\nBig picture\nImplementation detail\nArchitecture view\tClass / method view\nTech selection\nCoding structure\nScalability focus\nCode correctness focus\nInterview Tip\nSay confidently:\n“HLD is for architecture & scalability. LLD is for implementation and coding structure.”\n"}]}, {"title": "🧱 CORE BUILDING BLOCKS", "questions": [{"id": "Q783", "meta": "Amazon – Architecture Round", "title": "What are the core components of any large system? Most enterprise systems include", "body": "●\tClient (Web / Mobile)\n●\tBackend services\n●\tDatabase\n●\tCache layer\n●\tLoad balancer\n●\tSecurity (Auth)\n●\tLogging & Monitoring\nReal-world\nNetflix Amazon\nBanking systems\n—all follow the same blueprint.\n"}, {"id": "Q784", "meta": "Accenture – Scenario Based", "title": "What is scalability and why does it matter? Explanation", "body": "Scalability means the ability of a system to handle increased load without failure.\nReal example\nSalary day → banking traffic spikes.\nThe system must handle increased load smoothly.\n"}]}, {"title": "🔄 SCALING STRATEGIES", "questions": [{"id": "Q785", "meta": "Microsoft – Technical Round", "title": "Vertical vs Horizontal Scaling", "body": "Vertical Scaling\tHorizontal Scaling\nUpgrade RAM / CPU\nAdd more servers\nSimple\nComplex\nLimited\nHighly scalable\nSingle point of failure\tMore reliable\nInterview Tip\nSay:\n“Modern clouds prefer horizontal scaling.”\n"}, {"id": "Q786", "meta": "Amazon – Interview Favorite", "title": "What is a Load Balancer and why is it needed? Easy explanation", "body": "A load balancer distributes incoming traffic across multiple servers to:\n●\tAvoid overload\n●\tImprove availability\n●\tPrevent downtime\nExample\nAzure Load Balancer AWS ELB\nNGINX\n🗄 DATA & STORAGE DESIGN\n"}, {"id": "Q787", "meta": "Microsoft – Design Round", "title": "How do you choose between SQL and NoSQL? Use SQL when", "body": "●\tStrong relationships\n●\tACID transactions\n●\tStructured schema\n●\tBanking / Orders / Inventory\nUse NoSQL when\n●\tHuge scale\n●\tFlexible schema\n●\tHigh write speed\n●\tLogs / Analytics / IoT\n"}, {"id": "Q788", "meta": "Amazon – Scenario Based", "title": "What is database sharding?", "body": "Sharding = Splitting database into multiple parts.\nExample\nUser DB split by ID range 1–1,000,000 → DB1\n1,000,001–2,000,000 → DB2\nHelps handle massive users.\n"}]}, {"title": "⚡ CACHING (VERY IMPORTANT)", "questions": [{"id": "Q789", "meta": "Microsoft – Interview Favorite", "title": "What is caching and why do we need it?", "body": "Easy explanation\nCaching stores frequently accessed data in fast in-memory storage to reduce database hits.\nReal use\nProduct list cached in Redis\n→ Faster response\n→ Less DB load\n"}, {"id": "Q790", "meta": "Amazon – Architecture Round", "title": "Where should cache be used?", "body": "●\tFrequently accessed API data\n●\tDatabase queries\n●\tConfiguration values\nInterview Tip\nSay:\n“Cache data that is read often and changes rarely.”\n🔁 CONSISTENCY & RELIABILITY\n"}, {"id": "Q791", "meta": "Deloitte – Senior Round", "title": "What if cache and DB values differ?", "body": "This is cache inconsistency.\nSolutions\n●\tCache expiration\n●\tWrite-through cache\n●\tWrite-behind cache\n"}]}, {"title": "🧠 API DESIGN THINKING", "questions": [{"id": "Q792", "meta": "Accenture – Interview Favorite", "title": "What makes a good API design? Key points", "body": "Clear endpoints\nMeaningful HTTP verbs Versioning\nPagination Security\nExample:\nGET /api/v1/orders?page=1\n"}]}, {"title": "🧱 STATE MANAGEMENT", "questions": [{"id": "Q793", "meta": "Microsoft – Advanced Round", "title": "Stateless vs Stateful systems", "body": "Stateless\tStateful\nNo session stored\tStores session\nEasy to scale\nHard to scale\nCloud friendly\nLimited\nREST APIs\nLegacy apps\nInterview Tip\nSay:\n“Web APIs must be stateless.”\n"}]}, {"title": "🧠 FAULT TOLERANCE", "questions": [{"id": "Q794", "meta": "Amazon – Reliability Round", "title": "What if one service goes down?", "body": "A good system:\n●\tFails gracefully\n●\tRetries\n●\tUses fallback\n●\tAvoids cascade failure\nPattern\nCircuit Breaker\n"}]}, {"title": "🔐 SECURITY AT DESIGN LEVEL", "questions": [{"id": "Q795", "meta": "Microsoft – Security Design", "title": "How do you design secure systems?", "body": "●\tAuthentication (Who are you?)\n●\tAuthorization (What can you do?)\n●\tHTTPS\n●\tSecure secrets\nSecurity is designed, not patched later.\n📈 OBSERVABILITY\n"}, {"id": "Q796", "meta": "Accenture – Interview Favorite", "title": "Why logging & monitoring are critical?", "body": "Because:\nbugs happen → in production, not local.\nTools\nAzure Monitor Application Insights CloudWatch\n"}]}, {"title": "🧠 REAL DESIGN SCENARIOS", "questions": [{"id": "Q797", "meta": "Amazon – Scenario Based", "title": "The system works for 1k users but fails at 100k – why?", "body": "Common reasons: No caching Single DB\nNo load balancing Bad queries\n"}]}, {"title": "🧩 TRADE-OFF QUESTIONS", "questions": [{"id": "Q798", "meta": "Microsoft – Architecture Round", "title": "Is more microservices always better? Answer", "body": "No.\nMicroservices increase:\n●\tComplexity\n●\tDevOps overhead\n●\tCommunication challenges\nUse only when scale demands.\n"}]}, {"title": "🧠 COMMUNICATION IN DESIGN INTERVIEW", "questions": [{"id": "Q799", "meta": "ALL MNCs – IMPORTANT", "title": "How should you talk in a system design interview? Best strategy", "body": "Ask clarifying questions\nDefine assumptions Explain thinking\nPrefer simple, scalable designs Interviewers judge thinking, not perfection.\n"}]}, {"title": "🏁 FINAL FOUNDATION QUESTION", "questions": [{"id": "Q800", "meta": "ALL MNCs – FINAL", "title": "What is the most important thing in system design?", "body": "Best Interview Answer\n“Understanding requirements and making the right trade-offs between performance, cost, scalability, complexity, and reliability.”\n"}]}, {"title": "🔹 Real System Design Patterns & Scenarios", "questions": []}, {"title": "🧠 DESIGN APPROACH (INTERVIEW EXPECTATION)", "questions": [{"id": "Q801", "meta": "ALL MNCs – DESIGN STARTER", "title": "How do you approach a system design problem in an interview? Easy, step-by-step answer", "body": "1\tClarify requirements\n2\tIdentify scale (users, TPS, growth)\n3\tDefine high-level architecture\n4\tChoose database & storage strategy\n5\tAdd cache layer\n6\tPlan for scalability & reliability\n7\tDiscuss security\n8\tExplain trade-offs\nInterview Tip\nNever jump to DB immediately. Speak like an architect.\n"}]}, {"title": "🔗 CLASSIC DESIGN PROBLEMS", "questions": [{"id": "Q802", "meta": "Amazon – Interview Favorite", "title": "●\tAPI to create short URL", "body": "●\tGenerate unique key\n●\tStore mapping\n●\tRedirect service\nReal Components\nBackend → .NET Core / Node DB → SQL or NoSQL\nCache → Redis\nLoad Balancer → Nginx\n"}, {"id": "Q803", "meta": "Microsoft – Follow-up", "title": "How do you generate unique short URLs? Options", "body": "Base62 encoding\nHashing\nAuto-increment ID\nTrade-off\nPredictable vs secure randomness.\n🗄 DATA & CACHE STRATEGY\n"}, {"id": "Q804", "meta": "Amazon – Architecture Round", "title": "Cache", "body": "shortURL → longURL mapping\nWhy?\nBecause reads >> writes\nRedis improves performance massively.\n"}]}, {"title": "🧠 SCALABILITY THINKING", "questions": [{"id": "Q805", "meta": "Accenture – Scenario Based", "title": "How does URL shortener scale to millions of hits? Answer", "body": "Stateless services\nHorizontal scaling Distributed cache Load balancer Partition DB\n"}]}, {"title": "🔐 SECURITY & ABUSE PREVENTION", "questions": [{"id": "Q806", "meta": "Microsoft – Security Design", "title": "Rate limiting", "body": "CAPTCHA\nToken-based API usage Block harmful URLs\n🛒 E-COMMERCE DESIGN\n"}, {"id": "Q807", "meta": "Amazon – System Design", "title": "Product service", "body": "Order service Payment service\nInventory service User service\nThis is how Amazon, Flipkart work.\n"}]}, {"title": "🧠 DATABASE DESIGN", "questions": [{"id": "Q808", "meta": "Microsoft – Data Design", "title": "Why?", "body": "Transactions Consistency Referential integrity\nOrders cannot be eventually consistent.\n"}]}, {"title": "⚡ INVENTORY CHALLENGE", "questions": [{"id": "Q809", "meta": "Amazon – Hard Scenario", "title": "Locking", "body": "Optimistic concurrency Queue based processing\n"}]}, {"title": "🔄 ASYNC PROCESSING", "questions": [{"id": "Q810", "meta": "Accenture – Architecture Round", "title": "Decouple services", "body": "Handle spikes Retry mechanism Reliable delivery\nTools\nAzure Service Bus RabbitMQ\nKafka\n"}]}, {"title": "📦 NOTIFICATION SYSTEM", "questions": [{"id": "Q811", "meta": "Microsoft – Interview Favorite", "title": "Design Notification System (Email / SMS / Push) Design", "body": "Event → Queue → Worker → Provider\nBenefits\nScalable Retry safe Resilient\n"}]}, {"title": "🧠 REAL-TIME SYSTEMS", "questions": [{"id": "Q812", "meta": "Amazon – Advanced", "title": "WebSockets Message store Online status tracking Delivery confirmation", "body": ""}]}, {"title": "🧠 CONSISTENCY & EVENTUAL CONSISTENCY", "questions": [{"id": "Q813", "meta": "Microsoft – Architecture Round", "title": "Strong\tEventual", "body": "Immediate\nSlight delay\nSecure\nHighly scalable\nReal World\nBanking → Strong\nSocial Feeds → Eventual\n"}]}, {"title": "🧠 FAILURE HANDLING", "questions": [{"id": "Q814", "meta": "Deloitte – Senior Round", "title": "What if the message queue goes down?", "body": "Retry\nDead-letter queue\nAlerting\nFallback handling\n🔁 IDEMPOTENCY\n"}, {"id": "Q815", "meta": "Amazon – Interview Favorite", "title": "What is Idempotency? Why is it important?", "body": "Same request multiple times\n→ Same result\nReal Example\nPayment APIs Order submission\n"}]}, {"title": "🧠 API GATEWAY", "questions": [{"id": "Q816", "meta": "Microsoft – Architecture", "title": "Authentication", "body": "Rate limiting Logging Routing\nCentral entry point\n"}]}, {"title": "🧩 SERVICE COMMUNICATION", "questions": [{"id": "Q817", "meta": "Accenture – Technical Round", "title": "Sync\tAsync", "body": "Immediate\nQueue based\nTight coupling\nLoose coupling\nFaster\nMore resilient\n"}]}, {"title": "🧠  DESIGN  TRADE-OFFS", "questions": [{"id": "Q818", "meta": "Amazon – Senior Round", "title": "Monolith vs Microservices – How to choose? Consider", "body": "Team size\nSystem complexity Deployment needs Scalability needs\nMicroservices = power + complexity.\n"}]}, {"title": "🧠 INTERVIEW BEHAVIOR", "questions": [{"id": "Q819", "meta": "ALL MNCs", "title": "What if the interviewer disagrees with your design?", "body": "Say:\n“I’ll validate assumptions, ask constraints, and refine the solution based on feedback.” Shows maturity.\n"}]}, {"title": "🏁 FINAL QUESTION", "questions": [{"id": "Q820", "meta": "ALL MNCs – FINAL", "title": "What matters more – perfect design or trade-offs?", "body": "Best Answer\n“Trade-offs matter more. Real systems are about balancing performance, cost, complexity, security, and scalability.”\n"}]}, {"title": "🔹 Advanced System Design Scenarios", "questions": []}, {"title": "🧠 RATE LIMITING & TRAFFIC CONTROL", "questions": [{"id": "Q821", "meta": "Amazon – Interview Favorite", "title": "Easy Explanation", "body": "A rate limiter controls how many requests a client can send in a specific time window.\nWhy is it needed?\nPrevent abuse Protect backend Ensure fair usage\nReal example\nA user cannot hit API 10,000 times/sec.\nCommon Techniques\n●\tFixed Window\n●\tSliding Window\n●\tToken Bucket\n●\tLeaky Bucket\n"}, {"id": "Q822", "meta": "Microsoft – Architecture Round", "title": "API Gateway", "body": "Load Balancer Application Layer\nBest Practice\nImplement at API Gateway level\n→ Stops bad traffic early\n→ Saves backend cost\n"}, {"id": "Q823", "meta": "Accenture – Technical Round", "title": "Token Bucket\tLeaky Bucket", "body": "Allows burst traffic\tSmooth fixed rate\nFlexible\tStrict throttling\nCommon in APIs\tCommon in networking\n"}]}, {"title": "🧠 FILE STORAGE DESIGN", "questions": [{"id": "Q824", "meta": "Amazon – Design Round", "title": "Design a file storage system (like Google Drive) Core Components", "body": "Upload service\nMetadata database Blob/Object storage CDN for fast delivery\nKey Considerations\nSecurity Sharing links Versioning Scalability\n"}, {"id": "Q825", "meta": "Microsoft – Follow-up", "title": "How do you handle large file uploads?", "body": "Chunk uploads Resume uploads Parallel uploading\nUseful in real world: Google Drive, OneDrive.\n"}]}, {"title": "🔐 AUTHENTICATION SYSTEM DESIGN", "questions": [{"id": "Q826", "meta": "Accenture – Interview Favorite", "title": "Core Components", "body": "Login API\nUser database Token service\nToken validation middleware\nSupports: JWT\nOAuth SSO\n"}, {"id": "Q827", "meta": "Microsoft – Security Round", "title": "JWT vs Session-based auth — which scales better?", "body": "JWT scales better\nWhy?\nStateless\nNo server-side session storage required\n"}]}, {"title": "🧠 TOKEN MANAGEMENT", "questions": [{"id": "Q828", "meta": "Amazon – Advanced", "title": "How do you handle token expiration & refresh?", "body": "Short-lived Access Token Long-lived Refresh Token\nFlow:\nAccess token expires → Client uses refresh token → New access token issued. Security benefit.\n"}]}, {"title": "📊 LOGGING & ANALYTICS", "questions": [{"id": "Q829", "meta": "Microsoft – Architecture Round", "title": "Design a centralized logging system Core Components", "body": "Log producers\nLog ingestion pipeline Storage\nSearch & visualization\nReal Tools\nELK Stack Azure Monitor Splunk\n"}]}, {"title": "🧠 EVENT-DRIVEN SYSTEMS", "questions": [{"id": "Q830", "meta": "Amazon – Senior Round", "title": "Why event-driven architecture scales better?", "body": "Loose coupling Async processing Handles spikes Improves reliability\n🔁 DATA STREAMING\n"}, {"id": "Q831", "meta": "Microsoft – Advanced", "title": "Producers", "body": "Stream processor (Kafka / Spark) Storage\nDashboard\nUsed in:\nLive dashboards\nFinancial trading Metrics monitoring\n"}]}, {"title": "🧠 CONSISTENCY PATTERNS", "questions": [{"id": "Q832", "meta": "Accenture – Architecture Round", "title": "Data is not updated instantly everywhere", "body": "But becomes consistent after some time.\nExample\nLikes count on social media.\n"}]}, {"title": "🧪 CACHE STRATEGIES", "questions": [{"id": "Q833", "meta": "Amazon – Interview Favorite", "title": "Write-through\tWrite-back", "body": "Data written to DB immediately\tWrites delayed\nSafer\tFaster\nSlower\tRisk of data loss\n"}]}, {"title": "🧠 FAILURE RECOVERY", "questions": [{"id": "Q834", "meta": "Microsoft – Reliability", "title": "What is a Dead Letter Queue (DLQ)?", "body": "Stores failed messages Helps analyze issues Prevents message loss\n"}]}, {"title": "🧠 SEARCH SYSTEM DESIGN", "questions": [{"id": "Q835", "meta": "Amazon – Design Round", "title": "Indexer Service", "body": "Search Engine (ElasticSearch) Ranking logic\nAutosuggest\nUsed in:\nE-commerce Job portals\nStreaming platforms\n"}]}, {"title": "🧠 API VERSIONING AT SCALE", "questions": [{"id": "Q836", "meta": "Microsoft – Advanced", "title": "How do you version APIs in large systems?", "body": "URL versioning Header-based\nBackward compatibility\nMost common:\n/api/v1/users\n"}]}, {"title": "🔐 SECURITY AT SCALE", "questions": [{"id": "Q837", "meta": "Accenture – Security", "title": "How do you protect APIs from DDoS?", "body": "Rate limiting WAF\nCDN protection Autoscaling\n"}]}, {"title": "🧠 COST OPTIMIZATION", "questions": [{"id": "Q838", "meta": "Amazon – Architecture", "title": "How do you reduce cloud cost at scale?", "body": "Auto scaling Right-size VMs Cache heavily\nUse reserved instances\n"}]}, {"title": "🧠 DESIGN VALIDATION", "questions": [{"id": "Q839", "meta": "ALL MNCs – IMPORTANT", "title": "How do you validate your design?", "body": "Load testing Chaos testing Monitoring Alerts\nCapacity planning\nShows you are production minded.\n"}]}, {"title": "🏁 FINAL SYSTEM DESIGN QUESTION", "questions": [{"id": "Q840", "meta": "ALL MNCs – FINAL", "title": "What makes a system design interview successful?", "body": "Best Answer\n“Clear communication, right assumptions, scalable thinking, secure design, and strong trade-off explanation.”\n"}]}]}, {"title": "CHAPTER 12 – MICROSERVICES & ARCHITECTURE", "sections": [{"title": "🔹 Microservices Fundamentals & Core Patterns (Q841–Q860)", "questions": []}, {"title": "🧠 Microservices Basics (Q841–Q860)", "questions": [{"id": "Q841", "meta": "ALL MNCs – Entry Question", "title": "What are microservices in simple words?", "body": "Easy explanation\nMicroservices mean breaking one big application into multiple small, independent services, where each service:\n●\tHandles one responsibility\n●\tCan be deployed independently\n●\tCan scale independently\nReal-world example\nInstead of one huge e-commerce app:\n●\tUser Service\n●\tOrder Service\n●\tPayment Service\nEach works independently.\n"}, {"id": "Q842", "meta": "Accenture – Interview Favorite", "title": "Monolith vs Microservices", "body": "Monolith\tMicroservices\nSingle deployment\tIndependent deployments\nSimple to start\tComplex to manage\nTight coupling\tLoose coupling\nHard to scale\tEasy to scale\nInterview Tip\nSay:\n“Start with a monolith, move to microservices when scale demands.”\n"}]}, {"title": "🧱 WHEN TO USE MICROSOOERVICES", "questions": [{"id": "Q843", "meta": "Microsoft – Architecture Round", "title": "When should you NOT use microservices?", "body": "Avoid microservices when:\n●\tTeam is small\n●\tApplication is simple\n●\tTraffic is low\n●\tNo scaling problems\nBecause microservices increase operational complexity.\n"}]}, {"title": "🧠 SERVICE BOUNDARIES", "questions": [{"id": "Q844", "meta": "Amazon – Design Round", "title": "How do you decide microservice boundaries?", "body": "Use business domains, not technical layers.\nCorrect thinking\n❌ One “Database Service”\nUser Service, Order Service, Payment Service This follows Domain-Driven Design.\n🗄 DATABASE PER SERVICE\n"}, {"id": "Q845", "meta": "Microsoft – Interview Favorite", "title": "Why should each microservice have its own database?", "body": "Because it ensures:\n●\tIndependent scaling\n●\tIndependent deployments\n●\tLoose coupling\nKeyword interviewers love\n“Database per service”\n"}]}, {"title": "🔄 SERVICE COMMUNICATION", "questions": [{"id": "Q846", "meta": "Accenture – Technical Round", "title": "Synchronous vs Asynchronous communication", "body": "Sync (HTTP)\tAsync (Messaging)\nImmediate response\tEvent-driven\nSimple\tHighly scalable\nTight coupling\tLoose coupling\n"}, {"id": "Q847", "meta": "Amazon – Architecture Round", "title": "When do you choose async communication?", "body": "Use async when:\n●\tHigh traffic\n●\tBackground processing\n●\tResilience required\nCommon Tools\nKafka RabbitMQ\nAzure Service Bus\n"}]}, {"title": "🧠 API GATEWAY", "questions": [{"id": "Q848", "meta": "Microsoft – Interview Favorite", "title": "What is an API Gateway and why is it needed?", "body": "Single entry point for all microservices.\nHandles\nAuthentication Routing\nRate limiting Logging\nReal example\nAzure API Management\n"}]}, {"title": "🧪 SERVICE DISCOVERY", "questions": [{"id": "Q849", "meta": "Accenture – Senior Round", "title": "What is service discovery in microservices?", "body": "When instances change dynamically, service discovery helps services find each other.\nReal tools\nKubernetes Consul\n"}]}, {"title": "🧠 RESILIENCE PATTERNS", "questions": [{"id": "Q850", "meta": "Amazon – Interview Favorite", "title": "What is the Circuit Breaker pattern?", "body": "Stops calling a failing service to protect the system.\nExample\nPayment service down → Temporarily stop requests.\n🔁 RETRY & TIMEOUT\n"}, {"id": "Q851", "meta": "Microsoft – Advanced Round", "title": "Why retries can be dangerous?", "body": "Because too many retries can:\n●\tOverload the system\n●\tIncrease latency\nBest practice\nRetry with exponential backoff.\n"}]}, {"title": "🧠 DATA CONSISTENCY", "questions": [{"id": "Q852", "meta": "Accenture – Architecture Round", "title": "How do microservices maintain data consistency?", "body": "Using:\n●\tEventual consistency\n●\tSaga pattern\n"}]}, {"title": "🧩 SAGA PATTERN", "questions": [{"id": "Q853", "meta": "Amazon – Senior Round", "title": "Explain Saga Pattern with example", "body": "Manages distributed transactions with events.\nExample\nOrder workflow:\nOrder → Payment → Inventory → Shipping\nIf payment fails: Order is rolled back.\n"}]}, {"title": "🧠 EVENT-DRIVEN ARCHITECTURE", "questions": [{"id": "Q854", "meta": "Microsoft – Interview Favorite", "title": "Why is event-driven architecture popular?", "body": "Because it offers:\n●\tLoose coupling\n●\tBetter scalability\n●\tFault isolation\n"}]}, {"title": "🧪 DEPLOYMENT", "questions": [{"id": "Q855", "meta": "Accenture – DevOps Round", "title": "How do you deploy microservices safely?", "body": "Independent CI/CD pipelines Blue-Green deployment Feature flags\n"}]}, {"title": "🧠 OBSERVABILITY", "questions": [{"id": "Q856", "meta": "Microsoft – Senior Round", "title": "Why is observability critical?", "body": "Because failures are distributed.\n3 pillars\nLogs Metrics Traces\n"}]}, {"title": "🔐 SECURITY", "questions": [{"id": "Q857", "meta": "Amazon – Security Round", "title": "How do you secure service-to-service communication?", "body": "mTLS\nOAuth tokens Private networking\n"}]}, {"title": "🧠 REAL SCENARIO", "questions": [{"id": "Q858", "meta": "Deloitte – Scenario Based", "title": "One microservice is slow — how do you debug?", "body": "Check latency metrics Trace request path\nCheck dependent services\n"}]}, {"title": "🧠 TRADE-OFF", "questions": [{"id": "Q859", "meta": "Microsoft – Architecture Round", "title": "Biggest drawback of microservices?", "body": "Operational complexity\n"}]}, {"title": "🏁 FINAL QUESTION", "questions": [{"id": "Q860", "meta": "ALL MNCs – FINAL", "title": "When are microservices the right choice?", "body": "Best Interview Answer\n“When the system is large, teams are independent, traffic is high, and scalability + resilience are genuine needs — not just buzzwords.”\n"}]}, {"title": "🔹 Advanced Patterns, Data & Platform Concerns (Q861–Q890)", "questions": []}, {"title": "🧠 DATA & CACHING IN MICROSERVICES", "questions": [{"id": "Q861", "meta": "Microsoft – Architecture Round", "title": "How do you use caching in microservices without breaking consistency?", "body": "Easy explanation\nCache only what makes sense – mainly read-heavy and slow-changing data. Keep cache close to the service that owns the data.\nBest practices\n●\tUse TTL (expiry)\n●\tPrefer cache-aside pattern\n●\tInvalidate on write where possible\n●\tAvoid caching highly volatile data\nTools\nRedis\nAzure Cache for Redis\n"}, {"id": "Q862", "meta": "Amazon – Interview Favorite", "title": "Cache-aside vs Write-through cache", "body": "Cache-aside\tWrite-through\nApp controls cache\tCache\nauto-updates\nMore flexible\tSafer\nCan become stale\tSlower writes\n"}]}, {"title": "🧠 DATA DUPLICATION & OWNERSHIP", "questions": [{"id": "Q863", "meta": "Accenture – Senior Round", "title": "Is data duplication allowed in microservices?", "body": "Answer\nYes — controlled duplication is allowed.\nWhy?\nTo reduce:\n●\tcross-service dependency\n●\tnetwork calls\n●\tlatency\nGolden rule\nThere must still be one source of truth.\n"}]}, {"title": "🧠 CQRS PATTERN", "questions": [{"id": "Q864", "meta": "Microsoft – Interview Favorite", "title": "What is CQRS and when should you use it?", "body": "Explanation\nCQRS = Command Query Responsibility Segregation\nSeparate:\n●\tWrite model (commands)\n●\tRead model (queries)\nWhen to use\n●\tHeavy read traffic\n●\tComplex business logic\n●\tDifferent read/write performance needs\n"}, {"id": "Q865", "meta": "Amazon – Real Scenario", "title": "CQRS real example", "body": "Orders:\n●\tWrites stored in SQL\n●\tRead model copied to NoSQL for fast dashboards\n"}]}, {"title": "🧠 EVENT SOURCING", "questions": [{"id": "Q866", "meta": "Microsoft – Advanced Round", "title": "What is Event Sourcing?", "body": "Instead of storing the latest state, store every event that changed it.\nExample\nOrderCreated PaymentReceived OrderShipped\nState = replay of events.\n"}, {"id": "Q867", "meta": "Accenture – Trade-off Question", "title": "Event Sourcing pros and cons", "body": "Pros\nComplete audit history Easy rollback\nCons\nComplex\nHarder querying\n"}]}, {"title": "🧠 SCHEMA & VERSIONING", "questions": [{"id": "Q868", "meta": "Amazon – Architecture Round", "title": "How do you handle schema changes in microservices?", "body": "Backward compatible first:\n●\tDo not break consumers\n●\tVersion APIs\n●\tVersion events\n●\tUse consumer-driven contracts\n"}]}, {"title": "🧪 CONTRACT TESTING", "questions": [{"id": "Q869", "meta": "Microsoft – Senior Round", "title": "What is contract testing and why is it important?", "body": "Ensures provider changes do not break consumers.\nTools\nPact\nPostman Contract Testing\n"}]}, {"title": "🧠 SERVICE MESH", "questions": [{"id": "Q870", "meta": "Accenture – Advanced", "title": "What is a Service Mesh?", "body": "Manages:\n●\tTraffic\n●\tSecurity\n●\tObservability\nWithout code changes.\nTools\nIstio Linkerd\n"}]}, {"title": "🧠 KUBERNETES BASICS", "questions": [{"id": "Q871", "meta": "Microsoft – Interview Favorite", "title": "Why Kubernetes with microservices?", "body": "Because it offers:\n●\tAuto-scaling\n●\tSelf-healing\n●\tRolling deployments\n●\tTraffic management\n"}, {"id": "Q872", "meta": "Amazon – Technical Round", "title": "Pod vs Deployment", "body": "Pod\tDeployment\nSmallest unit\tManages pods\nCan die\tEnsures availability\n"}]}, {"title": "🧠 CONFIGURATION MANAGEMENT", "questions": [{"id": "Q873", "meta": "Accenture – Senior Round", "title": "How do you manage configuration?", "body": "Use:\n●\tEnvironment variables\n●\tCentralized config service\n●\tAzure App Configuration\n❌ Never hardcode config.\n"}]}, {"title": "🧠 SECURITY & ZERO TRUST", "questions": [{"id": "Q874", "meta": "Microsoft – Security Round", "title": "What is Zero Trust architecture?", "body": "Never assume trust — always verify. Even inside the network.\n"}]}, {"title": "🧠 OBSERVABILITY", "questions": [{"id": "Q875", "meta": "Amazon – Interview Favorite", "title": "How do you trace a request across microservices?", "body": "Use distributed tracing + correlation IDs.\nTools\nOpenTelemetry Application Insights\n"}]}, {"title": "🧠 FAILURE MODES", "questions": [{"id":
