<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MNC Interview Q&A – Chapters 4, 5 & 6</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --sidebar-bg: #111318;
    --sidebar-border: #1e2129;
    --card-bg: #161920;
    --card-border: #1e2530;
    --accent: #4f9cf9;
    --accent-dim: #1e3a5f;
    --accent-glow: rgba(79,156,249,0.12);
    --text-primary: #e8eaf0;
    --text-secondary: #7a8394;
    --text-muted: #4a5568;
    --green: #34d399;
    --amber: #fbbf24;
    --rose: #f87171;
    --purple: #a78bfa;
    --teal: #2dd4bf;
    --code-bg: #0a0d12;
    --pill-ms: #1d3557;
    --pill-amazon: #2d1b00;
    --pill-accenture: #1a0d2e;
    --pill-infosys: #0d2218;
    --pill-tcs: #1a1a00;
    --pill-deloitte: #001a2e;
    --header-h: 56px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: grid;
    grid-template-rows: var(--header-h) 1fr;
    grid-template-columns: 280px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ── HEADER ── */
  header {
    grid-column: 1 / -1;
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--sidebar-border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 20px;
    position: relative;
    z-index: 100;
  }
  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.25rem;
    color: var(--accent);
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .logo span { color: var(--text-secondary); font-size: 0.85rem; font-family: 'Outfit', sans-serif; font-weight: 300; margin-left: 10px; }
  .search-wrap {
    flex: 1;
    max-width: 480px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
  }
  #searchInput {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 8px 12px 8px 38px;
    color: var(--text-primary);
    font-family: 'Outfit', sans-serif;
    font-size: 0.875rem;
    outline: none;
    transition: border-color 0.2s;
  }
  #searchInput:focus { border-color: var(--accent); }
  #searchInput::placeholder { color: var(--text-muted); }
  .stat-pill {
    margin-left: auto;
    background: var(--accent-dim);
    color: var(--accent);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
  }

  /* ── SIDEBAR ── */
  aside {
    background: var(--sidebar-bg);
    border-right: 1px solid var(--sidebar-border);
    overflow-y: auto;
    padding: 16px 0 32px;
    scrollbar-width: thin;
    scrollbar-color: var(--card-border) transparent;
  }
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 2px; }

  .chapter-group { margin-bottom: 4px; }
  .chapter-label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px 8px;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    cursor: pointer;
    user-select: none;
    transition: color 0.2s;
    position: sticky;
    top: 0;
    background: var(--sidebar-bg);
    z-index: 2;
  }
  .chapter-label:hover { color: var(--text-secondary); }
  .chapter-num {
    background: var(--accent-dim);
    color: var(--accent);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.65rem;
  }
  .ch-arrow { margin-left: auto; transition: transform 0.25s; }
  .chapter-group.collapsed .ch-arrow { transform: rotate(-90deg); }
  .chapter-group.collapsed .section-list { display: none; }

  .section-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 20px 7px 24px;
    font-size: 0.815rem;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
    border-left: 2px solid transparent;
    line-height: 1.35;
  }
  .section-item:hover { color: var(--text-primary); background: rgba(255,255,255,0.03); }
  .section-item.active {
    color: var(--accent);
    border-left-color: var(--accent);
    background: var(--accent-glow);
    font-weight: 500;
  }
  .section-count {
    margin-left: auto;
    font-size: 0.7rem;
    color: var(--text-muted);
    background: var(--card-bg);
    padding: 1px 6px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  /* ── MAIN CONTENT ── */
  main {
    overflow-y: auto;
    padding: 32px 40px;
    scrollbar-width: thin;
    scrollbar-color: var(--card-border) transparent;
  }
  main::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 3px; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--card-border);
  }
  .section-header h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.6rem;
    color: var(--text-primary);
    font-weight: 400;
  }
  .section-header .q-range {
    font-size: 0.8rem;
    color: var(--text-muted);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    padding: 3px 10px;
    border-radius: 12px;
    margin-left: auto;
  }

  /* ── Q CARDS ── */
  .q-grid { display: flex; flex-direction: column; gap: 20px; }
  .q-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
    animation: fadeIn 0.3s ease forwards;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .q-card:hover {
    border-color: #2a3545;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
  .q-card.highlight { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-dim); }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 16px 20px;
    cursor: pointer;
    user-select: none;
  }
  .q-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-dim);
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .q-title-wrap { flex: 1; }
  .q-title {
    font-size: 1rem;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1.45;
    margin-bottom: 6px;
  }
  .q-meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .company-pill {
    font-size: 0.67rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .pill-microsoft { background: var(--pill-ms); color: #90c4ff; }
  .pill-amazon { background: var(--pill-amazon); color: #ff9900; }
  .pill-accenture { background: var(--pill-accenture); color: #c084fc; }
  .pill-infosys { background: var(--pill-infosys); color: #6ee7b7; }
  .pill-tcs { background: var(--pill-tcs); color: #fde68a; }
  .pill-deloitte { background: var(--pill-deloitte); color: #7dd3fc; }
  .pill-default { background: var(--card-border); color: var(--text-secondary); }
  .round-pill {
    font-size: 0.67rem;
    padding: 2px 8px;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    color: var(--text-muted);
    text-transform: capitalize;
  }
  .expand-btn {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    background: rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
    transition: background 0.15s, transform 0.25s;
    color: var(--text-muted);
  }
  .q-card.open .expand-btn { transform: rotate(180deg); background: var(--accent-dim); color: var(--accent); }

  .q-body {
    display: none;
    padding: 0 20px 20px;
    border-top: 1px solid var(--card-border);
    margin-top: 0;
  }
  .q-card.open .q-body { display: block; }
  .q-body-inner {
    padding-top: 16px;
    font-size: 0.88rem;
    line-height: 1.75;
    color: var(--text-secondary);
  }
  .q-body-inner code, .q-body-inner pre {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    background: var(--code-bg);
    border: 1px solid var(--card-border);
    border-radius: 6px;
    color: #a5d8ff;
    padding: 12px 16px;
    display: block;
    margin: 12px 0;
    overflow-x: auto;
    white-space: pre;
    line-height: 1.6;
  }
  .q-body-inner .bullet {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    margin: 4px 0;
    color: var(--text-secondary);
  }
  .q-body-inner .bullet::before {
    content: '▸';
    color: var(--accent);
    flex-shrink: 0;
    margin-top: 1px;
  }
  .q-body-inner .section-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin: 14px 0 6px;
  }
  .q-body-inner .tip-box {
    background: rgba(251,191,36,0.07);
    border-left: 3px solid var(--amber);
    border-radius: 0 6px 6px 0;
    padding: 10px 14px;
    margin: 12px 0;
    font-size: 0.85rem;
    color: #fde68a;
  }
  .q-body-inner .tip-box::before { content: '💡 '; }

  /* empty state */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
  }
  .empty-state svg { margin-bottom: 16px; opacity: 0.3; }
  .empty-state h3 { font-size: 1.1rem; color: var(--text-secondary); margin-bottom: 8px; }

  /* search results */
  #resultCount {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 20px;
  }
  #resultCount span { color: var(--accent); font-weight: 600; }

  .chapter-divider {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    color: var(--text-primary);
    margin-bottom: 8px;
    font-weight: 400;
  }
  .chapter-sub {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 32px;
  }
</style>
</head>

  <div class="logo">MNC Interview Q&A <span>Chapters 4 · 5 · 6</span></div>

</header>
